function compareBest(elem1, elem2) {

         styleTxt = styleTxt.replace(re05, re05_).replace(re06, re06_).replace(re07, re07_);

         return styleTxt;    //  Возвращаем готовый текст.
         }





///////////////   СВЕРКА ТЕКСТОВ :  Создание сортированного массива

 function cort(M, numFile) {
        LBL:
         for (k=M.length-1; k>=0; k--) {     //  Цикл для строк текста.
                 L1 = -1;                               //  Сбрасываем минимальную позицию.
                 L2 = mPSort.length;       //  Сбрасываем максимальную позицию.
                 str = M[k].innerText;    //  Получаем текст очередной строки.
                 while (L2-L1 > 1) {                         //  Цикл для поиска позиции строки в сортированном ряде строк.
                         LMidi = Math.floor((L2+L1)/2);      //  Получаем среднюю позицию в сортированном ряде строк.
                         if (str == mPSort[LMidi][0]) {           //  Если текущая строка совпадает со строкой на средней позиции...
                                 mPSort[LMidi].push(numFile+":"+k);     //  Добавляем координаты ещё одной строки.
                                 continue LBL;                                                    //  Переходим к следующей строке.
                                 }
                         if (str > mPSort[LMidi][0])      //  Если текущая строка больше строки на средней позиции...
                                 L1 = LMidi;             //  то смещаем минимальную позицию на место средней позиции.
                             else  L2 = LMidi;      //  Если меньше -- смещаем максимальную позицию на место средней позиции.
                         }
                 //  Как только между минимальной и максимальной позицией не останется ни одной строки...
                 mPSort.splice(L2, 0, [str, numFile+":"+k]);    //  Вставляем текущую строку и её координаты между этими позициями.
                 }
         }




///////////////   СВЕРКА ТЕКСТОВ :  Сверка индексов строк

 function compareTxt() {

 mCharMP1 = [];       //  Очищаем массивы текста для новых результатов.
 mCharMP2 = [];


//   Поиск первого несовпадающего участка

 if (charMP1.length < charMP2.length) {    //  Если 1-й текст меньше 2-го...
         order = true;          //  то сохраняем порядок фрагментов.
         frag1 = charMP1;
         frag2 = charMP2;
         }
     else {               //  А если больше...
         order = false;                    //  то изменяем порядок фрагментов.
         frag1 = charMP2;
         frag2 = charMP1;
         }

 L1 = 0;   //  Исходное значение  для наименьшей длины участка.
 L2 = frag1.length+1;   //  Исходное значение  для наибольшей длины участка.
 LBest = 0;                       //  Лучшая длина участка.

 while (L2-L1 >= 2) {                                        //  Цикл, который будет выполняться, пока значения наименьшей и наибольшей длины участка не встанут рядом.
         LMidi = Math.floor((L2+L1)/2);          //  Получение средней длины (между наименьшей и наибольшей длиной).
         if (frag1.substring(0, LMidi) == frag2.substring(0, LMidi)) {      //  Если участки средней длины совпадают (в начале фрагментов)...
                 L1 = LMidi;                    //   Изменяем наименьшую длину на среднее значение.
                 LBest = LMidi;                    //   Изменяем лучшую длину на среднее значение.
                 }
             else  L2 = LMidi;        //  Если участки не совпадают -- изменяем наибольшую длину на среднее значение.
         }

 subFrag = frag1.substring(0, LBest);       //  Получаем текст 1-го совпадающего участка.
 if ((rS = /<[^<>]*$/.exec(subFrag)) != null)     //  Если в текст попал обрывок тега...
         LBest -= rS[0].length;                              //  то сокращаем длину полученного участка.

 mCharMP1[0] = frag1.substring(0, LBest);   //  Добавляем текст 1-го совпадающего участка в массивы с результатами.
 mCharMP2[0] = mCharMP1[0];

 frag1 = frag1.substring(LBest);    //  Убираем из фрагментов полученный участок.
 frag2 = frag2.substring(LBest);

 L1 = 0;                               //  Исходное значение  для наименьшей длины участка.
 L2 = frag1.length+1;   //  Исходное значение  для наибольшей длины участка.
 LBest = 0;                       //  Лучшая длина участка.

 while (L2-L1 >= 2) {                                        //  Цикл, который будет выполняться, пока значения наименьшей и наибольшей длины участка не встанут рядом.
         LMidi = Math.floor((L2+L1)/2);          //  Получение средней длины (между наименьшей и наибольшей длиной).
         if (frag1.substring(frag1.length - LMidi) == frag2.substring(frag2.length - LMidi)) {      //  Если участки средней длины совпадают (в конце фрагментов)...
                 L1 = LMidi;                    //   Изменяем наименьшую длину на среднее значение.
                 LBest = LMidi;                    //   Изменяем лучшую длину на среднее значение.
                 }
             else  L2 = LMidi;        //  Если участки не совпадают -- изменяем наибольшую длину на среднее значение.
         }

 if (order) {                                    //  Если порядок сверки обычный...
         mCharMP1[1] = frag1.substring(0, frag1.length - LBest);   //  то добавляем в массивы текст несовпадающих участков в обычном порядке.
         mCharMP2[1] = frag2.substring(0, frag2.length - LBest);
         }
     else {                                    //  Если порядок сверки обратный...
         mCharMP1[1] = frag2.substring(0, frag2.length - LBest);   //  то добавляем в массивы текст несовпадающих участков в обратном порядке.
         mCharMP2[1] = frag1.substring(0, frag1.length - LBest);
         }

 mCharMP1[2] = frag1.substring(frag1.length - LBest);   //  Добавляем текст 2-го совпадающего участка в массивы с результатами.
 mCharMP2[2] = mCharMP1[2];


//   Основная часть сверки

 LParent = [, mCharMP1[1].length];    //  Добавляем первое значение в массив длин родительских совпадающих участков (для k=1).
 //  * mCharMP1[1] -- это несовпадающий участок, необходим для заполнения первого значения. Все следующие значения будут получены из совпадающих участков.

LBL1:
 for (k=1; ; ) {      //  Запускаем цикл для текстов несовпадающих участков из массива с финальными результатами.

         if (mCharMP1[k].length < mCharMP2[k].length) {    //  Если очередной несовпадающий участок из найденного текста меньше чем из заменяемого...
                 order = true;          //  то сохраняем порядок фрагментов.
                 frag1 = mCharMP1[k];
                 frag2 = mCharMP2[k];
                 }
             else {               //  А если больше...
                 order = false;                    //  то изменяем порядок фрагментов.
                 frag1 = mCharMP2[k];
                 frag2 = mCharMP1[k];
                 }

         L1 = mainMinSim-1;                    //  Исходное значение  для наименьшей длины участка.
         L2 = Math.min(LParent[k], frag1.length)+1;    //  Исходное значение  для наибольшей длины участка.  // * Не может превышать длину родительского совпадающего участка.
         mRR = [];             //  Очищаем массив результата  с  совпадающем участком   максимальной   длины.

         while (L2-L1 >= 2) {                                        //  Цикл, который будет выполняться, пока значения наименьшей и наибольшей длины участка не встанут рядом.
                 LMidi = Math.floor((L2+L1)/2);          //  Получение средней длины (между наименьшей и наибольшей длиной).
                 mR = [];             //  Очищаем массив результата  с  совпадающем участком   заданной   длины.

LBL2:
                 for (pos1 = 0;  pos1 <= frag1.length - LMidi;  pos1++) {        //  Запускаем цикл для позиции суб-фрагмента в 1-м фрагменте.
                         subFrag = frag1.substring(pos1, pos1 + LMidi);          //  Получаем суб-фрагмент заданной длины на текущей позиции.

                         if ((frag2.indexOf(subFrag)) != -1) {                                   //  Если текст суб-фрагмента можно найти во 2-м фрагменте, т.е. это совпадающий участок...

                                 //  Сохраняем промежуточный результат.
                                 mR[0] = pos1;     //  Позиция совпадающего участка в 1-м фрагменте.
                                 mR[1] = frag2.indexOf(subFrag);     //  Позиция совпадающего участка во 2-м фрагменте.
                                 mR[2] = LMidi;    //  Длина совпадающего участка без обрывка тега, которого здесь и не было (для выделения FONT).
                                 mR[3] = LMidi;     //  Вся длина совпадающего участка (для максимальной длины дочерних совпадающих участков).
                                 break;         //  Прерываем цикл поиска совпадающего участка заданной длины.
                                 }
                         }

                 if (mR.length != 0) {    //  Если цикл выдал результат...
                         L1=LMidi;                    //   Изменяем наименьшую длину на среднее значение.
                         for (h=0; h<=4; h++)  mRR[h] = mR[h];    //  Сохраняем промежуточный результат.
                         }
                     else                //  Если нет результата...
                         L2=LMidi;               //  Изменяем наибольшую длину на среднее значение.
                 }

         if (mRR.length == 0) {              //  Если основной цикл для поиска совпадающего участка максимальной длины ничего не выдал...

                 while (mCharMP1[(k=k+2)] != undefined) {             //  Проверяем в массиве  наличие следующего несовпадающего участка.
                         if ((mCharMP1[k].length + ":" + mCharMP2[k].length).search(/^0:|:0$|^1:1$|^1:2$|^2:1$/) == -1)
                         //  Если участки не из тех, где...  или один из участков нулевой длины, или оба состоят из 1 символа, или один участок - 1 символ, а другой - 2 символа...
                                 continue LBL1;           //  то переходим к очередному дроблению несовпадающего участка.
                         }
                 break;           //  Если следующий участок так и не найден  --  Прерываем основной цикл.
                 }

             else {            //  Если основной цикл выдал результаты...

                 if (order) {                                    //  Если порядок сверки обычный -- добавляем в массивы текст трех участков в обычном порядке (с заменой обработанного участка).
                         mCharMP1.splice(k, 1,   frag1.substring(0, mRR[0]),     frag1.substring(mRR[0], mRR[0] + mRR[2]),     frag1.substring(mRR[0] + mRR[2]));
                         mCharMP2.splice(k, 1,   frag2.substring(0, mRR[1]),    frag2.substring(mRR[1], mRR[1] + mRR[2]),    frag2.substring(mRR[1] + mRR[2]));
                         }
                     else {                                    //  Если порядок сверки обратный -- добавляем в массивы текст трех участков в обратном порядке (с заменой обработанного участка).
                         mCharMP1.splice(k, 1,   frag2.substring(0, mRR[1]),    frag2.substring(mRR[1], mRR[1] + mRR[2]),    frag2.substring(mRR[1] + mRR[2]));
                         mCharMP2.splice(k, 1,   frag1.substring(0, mRR[0]),     frag1.substring(mRR[0], mRR[0] + mRR[2]),     frag1.substring(mRR[0] + mRR[2]));
                         }

                 LParent.splice(k, 1,   mRR[3], undefined, mRR[3]);    //  Добавляем значения в массив длин родительских совпадающих участков.
                 //  * Указывается длина нового совпадающего участка для двух новых несовпадающих участков (в них невозможно найти совпадающие участки большей длины).
                 }
         }
 }

 function addFont(styleTxt) {
         styleTxt = styleTxt.replace(reClear1, "");
         if (styleTxt.replace(/<[^<>]+>/g, "") != "")       //  Если строка содержит текст -- выделяем всю строку обычным способом.
                 return  "<FONT style=\"background: #E8E; color: #000;\">" + styleTxt + "</FONT>";
         if (styleTxt == "")       //  Если строка пустая -- добавляем узкую линию.
                 return "<FONT style=\"width=2; overflow: hidden; background: #84F\"></FONT>";
         //  В остальных случаях -- если строка содержит только теги -- добавляем фон с полями.
         return "<FONT style=\"padding: 3; background: #D7D\">" + styleTxt + "</FONT>";
         }

///////////////   Функция поиска первой строки в видимой области

 function findElem() {
         var h1 = blockFiles.getBoundingClientRect().top;     //  Получаем отступ поля с текстами   от верхнего края окна.
         var h2 = blockFiles.getBoundingClientRect().bottom;     //  Получаем отступ нижнего края поля с текстами   от верхнего края окна.
         var hEl;           //  Отступ элемента строки   от верхнего края окна.

         L1 = -1;                                 //  Сбрасываем минимальный индекс элемента.
         L2 = mP2.length;             //  Сбрасываем максимальный индекс элемента.
         while (L2-L1 > 1) {                                  //  Цикл для поиска подходящей строки.
                 LMidi = Math.floor((L2+L1)/2);      //  Получаем среднюю позицию элемента.
                 if (mP2[LMidi].getBoundingClientRect().top < h1)        //  Если текущий элемент строки выше верхней границы текстового поля...
                         L1 = LMidi;             //  то смещаем минимальный индекс элемента на место средней позиции.
                     else  L2 = LMidi;      //  Если ниже -- смещаем максимальный индекс элемента на место средней позиции.
                 }
         //  Как только минимальный и максимальный индекс встанут рядом...
         if (L2 != mP2.length  &&  ((hEl = mP2[L2].getBoundingClientRect().top) < h2  ||  L2 == 0))    //  Если полученный элемент стоит выше нижней границы текстового поля...
                 return  [mP2[L2],  hEl, L2];                                               //  то возвращаем данные найденного элемента.
            else   return  [mP2[L1],  mP2[L1].getBoundingClientRect().top, L1];     //  Ниже -- возвращаем данные предыдущего элемента.
         }


///////////////   Функция коррекции счетчика

 function selectCount(mode) {
         if (mode == 0) {                           //  Если выделяется поле ввода...
                 if (blockCount.value.search(/ \/ /) != -1)     //  Если в тексте есть разделитель...
                         blockCount.value = blockCount.value.replace(/ \/ .+/g, "");    //  то удаляем разделитель и общее количество отличий.
                 return;          //  Выходим из функции.
                 }
         lengthMFont = mFont.length;           //  Получаем общее количество выделений.
         if (mode == 2) {                           //  Если снимается выделение с поля...
                 blockCount.value = countFont + " / " + lengthMFont;     //  то возвращаем в поле значение счетчика
                 return;                                                                //  и выходим из функции.
                 }
         //  Если в текстовом поле нажат "Enter"...
         if (blockCount.value.search(/^\d+$/) != -1  &&  +blockCount.value <= lengthMFont)    //  Если введенная запись в поле счетчика отличий корректна...
                 countFont = +blockCount.value;                //  то изменяем счетчик текущего номера отличия.
             else
                 blockCount.value = countFont;    //  Иначе -- заменяем некорректную запись на старую.
         if (lengthMFont < 1  ||  countFont < 1)    //  Если выбрано нулевое отличие,   или отличий нет...
                 return;                                                        //  то выходим из функции.
         if (startFont)        //  Если есть элемент с исходным выделением...
                 startFont.style.border = "none";     //  то удаляем у него рамку.
         startFont = mFont[countFont-1];                 //  Делаем выбранный элемент   исходным.
         startFont.style.border = "2 solid #14E";    //  Добавляем рамку.
         GoTo3(mFont[countFont-1]);    //  Переход на выбранный элемент.
         }

///////////////   Функция умного поиска предыдущего отличия

 function prevFont() {

         var h1 = blockFiles.getBoundingClientRect().top;           //  Получаем отступ поля с текстами   от верхнего края окна.
         var h2 = blockFiles.getBoundingClientRect().bottom;   //  Получаем отступ нижнего края поля с текстами   от верхнего края окна.
         var h3 = h1 + (h2 - h1)*0.3;                                                     //  Получаем отступ линии просмотра   от верхнего края окна.
         var hEl;           //  Отступ элемента строки   от верхнего края окна.

         try {                      //  Если есть корректный исходный элемент <FONT>...
                 hEl = startFont.getBoundingClientRect().top;     //  Определяем высоту исходного выделения элемента <FONT>.
                 if (hEl > h1  &&  hEl < h2) {           //  Если выделение находится в области просмотра, то не меняем порядок перехода:
                         if  (countFont < 2)                    //  Если нет предыдущего элемента <FONT>...
                                 return lengthMFont;        //  то возвращаем последний элемент.
                             else  return countFont - 1;      //  Иначе -- возвращаем предыдущий элемент.
                         }
                 }
         catch(e) {}

         //  Ищем новый исходный элемент <FONT> в области просмотра.
         L1 = -1;                                 //  Сбрасываем минимальный индекс элемента.
         L2 = lengthMFont;             //  Сбрасываем максимальный индекс элемента.
         while (L2-L1 > 1) {                                  //  Цикл для поиска подходящего элемента.
                 LMidi = Math.floor((L2+L1)/2);      //  Получаем среднюю позицию элемента.
                 if (mFont[LMidi].getBoundingClientRect().top < h3)        //  Если текущий элемент выше нижней границы текстового поля...
                         L1 = LMidi;             //  то смещаем минимальный индекс элемента на место средней позиции.
                     else  L2 = LMidi;      //  Если ниже -- смещаем максимальный индекс элемента на место средней позиции.
                 }
         //  Как только минимальный и максимальный индекс встанут рядом...
         if (L1 >= 0)    //  Если минимальный элемент существует...
                 return  L1+1;     //  то возвращаем номер минимального элемента.
         return  lengthMFont;     //  Иначе -- возвращаем номер последнего элемента.
         }

         //  Как только минимальный и максимальный индекс встанут рядом...

///////////////   Функция выбора типа окончания в зависимости от числа

 function pad(num, M) {         //  * Исходные данные: "Число".
         var m1 = num%10;          //  Последняя цифра.
         var m2 = num%100 - m1;   //  Десятки.
         if (m2 == 10)  return M[2];            //  Если предпоследняя цифра это 1  --  возвращаем тип окончания "2" (114 метров).
         if (m1==1)  return M[0];                      //  Если последняя цифра это 1  --  возвращаем тип окончания "0" (101 метр).
         if (m1>=2 && m1<=4)  return  M[1];     //  Если последняя цифра это 2, 3 или 4  --  то возвращаем тип окончания "1" (102 метра).
         return M[2];          //  В остальных случаях возвращаем тип окончания "2" (114 метров).
         }



///////////////   Функция конвертации времени  (мс  => мин., с)

function time(T) {   //  * Исходные данные: "Промежуток времени (в миллисекундах)".
         var tempus="";    //  Начальное значение для результата.
         var min  = Math.floor(T/60000);   //  Получение минут.
         var secD = (T%60000)/1000;    //  Получение секунд с дробной частью.
         var sec = Math.floor(secD);    //  Получение секунд.
         if (min==0)          //  Если в промежутке времени "0" минут...
                 //  то результат приравниваем к первым 5 символам секунд (с дробной частью), удаляем последние нули (из дробной части), и заменяем точку на запятую.
                 return   (+(secD+"").replace(/(.{1,5}).*/g, "$1")+"").replace(".", ",")+" сек";
             else              //  Если же минут больше "0"...
                 return   min+" мин" + (sec != 0  ?  tempus+=" "+ sec+" с"  :  "");    //  Если же минут больше "0" -- то результат = число минут + число секунд (если они есть).
         }



///////////////   Функция перехода к элементу книги

function GoTo3(elem) {
         if (!elem)  return;   //  Если элемент удален  --  выходим из функции.

         var wH = blockFiles.clientHeight;   //  Высота текстового поля.
         var h1 = blockFiles.getBoundingClientRect().top;
         var b=elem.getBoundingClientRect();                   //  Получение координат элемента.
         var elemHeight=b.bottom-b.top;                  //  Высота элемента (в пикселях).
         var elemTop = b.top;                  //  Отступ элемента от верхнего края текстового поля.

         if (elemHeight <= wH)          //  Если высота элемента меньше высоты текстового поля...
                 blockFiles.scrollTop += elemTop - 3 - Math.round((wH-elemHeight)*0.3 + h1);   //  то выставляем элемент согласно указанному расположению,
             else  blockFiles.scrollTop += elemTop - 3 - h1;       //  а если нет - то выставляем элемент почти впритык к верхнему краю.
