<html>
<head>
<title>Параметры вставки ссылок на пустые картинки</title>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<style>
body {
    font-family: Tahoma, sans-serif;
    margin: 10px;
    padding: 0;
    font-size: 14px;
}
.form-container {
    margin: 5px;
}
h3 {
    margin: 0 0 3px 0;
    font-size: 15px;
}
.version-info {
    margin: 0 0 15px 0;
    font-size: 12px;
    color: #666;
}
.help-btn {
    width: 26px;
    height: 26px;
    border: 2px solid #FFA500;
    background: #FFD700;
    color: #000;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    border-radius: 50%;
    padding: 0;
    line-height: 22px;
    text-align: center;
    margin-left: 20px;
    margin-right: 20px;
}
.help-btn:hover {
    background: #FFC000;
}
.help-panel {
    display: none;
    position: absolute;
    bottom: 100%;
    left: 0;
    width: 80%;
    max-height: 220px;
    overflow-y: auto;
    background: #FFFEF5;
    border: 2px solid #FFA500;
    padding: 10px;
    font-size: 11px;
    color: #444;
    line-height: 1.3;
    z-index: 100;
    text-align: left;
}
.help-panel b {
    color: #000;
}
.checkbox-group {
    margin: 10px 0;
    padding: 8px;
    font-size: 14px;
}
.step-row {
    margin: 5px 0 3px 25px;
    font-size: 12px;
}
input#stepStart, input#stepEnd {
    width: 22px !important;
    min-width: 22px !important;
    max-width: 22px !important;
    font-size: 12px;
    text-align: center;
    margin: 0 3px;
    padding: 1px;
}
.sub-checkbox {
    margin: 3px 0 3px 25px;
    font-size: 12px;
}
.sub-checkbox input[type="checkbox"] {
    margin-right: 6px;
}
.radio-group {
    margin: 5px 0 3px 25px;
    font-size: 12px;
}
.radio-group label {
    display: inline-block;
    margin: 2px 15px 2px 0;
}
.radio-group input[type="radio"] {
    margin-right: 4px;
}
.buttons {
    margin-top: 15px;
    text-align: center;
    position: relative;
}
input[type="button"] {
    padding: 6px 15px;
    margin: 0 10px;
    font-size: 14px;
}
input[type="checkbox"] {
    margin-right: 8px;
    transform: scale(1.1);
}
</style>
</head>
<body>
<div class="form-container">
    <h3>Вставить ссылки на пустые картинки в началах и концах секций</h3>
    <div class="version-info" id="versionInfo"></div>
    
    <div class="checkbox-group">
        <input type="checkbox" name="insertStart" id="insertStart" checked>
        <label for="insertStart">Вставить пустые картинки <strong>в начале</strong> секций</label>
        <div class="step-row">
            <label for="stepStart">Шаг чередования в началах:</label>
            <input type="text" id="stepStart" value="" maxlength="2" size="2">
            <span style="color: #888;">(пусто = везде)</span>
        </div>
        <div class="sub-checkbox">
            <input type="checkbox" id="skipStartWithImage">
            <label for="skipStartWithImage">Пропускать, если есть обычная картинка</label>
        </div>
        <div class="radio-group">
            <label><input type="radio" name="modeStart" value="all" checked> Все секции</label>
            <label><input type="radio" name="modeStart" value="top"> Верхний уровень</label>
            <label><input type="radio" name="modeStart" value="bottom"> Нижний уровень</label>
        </div>
    </div>
    
    <div class="checkbox-group">
        <input type="checkbox" name="insertEnd" id="insertEnd" checked>
        <label for="insertEnd">Вставить пустые картинки <strong>в конце</strong> секций</label>
        <div class="step-row">
            <label for="stepEnd">Шаг чередования в концах:</label>
            <input type="text" id="stepEnd" value="" maxlength="2" size="2">
            <span style="color: #888;">(пусто = везде)</span>
        </div>
        <div class="sub-checkbox">
            <input type="checkbox" id="skipEndWithImage">
            <label for="skipEndWithImage">Пропускать, если есть обычная картинка</label>
        </div>
        <div class="radio-group">
            <label><input type="radio" name="modeEnd" value="all" checked> Все секции</label>
            <label><input type="radio" name="modeEnd" value="top"> Верхний уровень</label>
            <label><input type="radio" name="modeEnd" value="bottom"> Нижний уровень</label>
        </div>
    </div>
    
    <div class="checkbox-group">
        <input type="checkbox" name="skipNameless" id="skipNameless" checked>
        <label for="skipNameless">Пропускать безымянные секции</label>
    </div>
    
    <div class="buttons">
        <div class="help-panel" id="helpPanel"></div>
        <button class="help-btn" onclick="toggleHelp()" title="Помощь">?</button>
        <input type="button" value="Выполнить" onclick="doOK()">
        <input type="button" value="Отмена" onclick="doCancel()">
    </div>
</div>

<script>
// Получаем версию из аргументов диалога
var scriptVersion = "4.9";
try {
    if (window.dialogArguments) {
        scriptVersion = window.dialogArguments;
    }
} catch(e) {}

// Отображаем версию
document.getElementById('versionInfo').innerHTML = 'ver. ' + scriptVersion;

// Обновляет текст помощи
function updateHelpText() {
    var hp = document.getElementById('helpPanel');
    hp.innerHTML = '<b>Инструкция:</b><br><br>' +
        '• <b>Вставить пустые картинки в начале/в конце секций</b> — выберите, куда расставлять пустые блочные картинки (#undefined).<br><br>' +
        '• <b>Шаг чередования</b> — сколько секций пропускать между вставками. Пусто = вставлять в каждую подходящую. 1 = через одну, 2 = через две и т.д.<br><br>' +
        '• <b>Пропускать, если есть обычная картинка</b> — секции, где уже стоит реальная иллюстрация (не #undefined), будут пропущены. Эти секции не участвуют в подсчёте шага чередования.<br><br>' +
        '• <b>Все секции / Верхний уровень / Нижний уровень</b> — фильтр секций для обработки.<br>' +
        '&nbsp;&nbsp;- <b>Верхний уровень</b> — секции прямо в body (не вложенные в другие).<br>' +
        '&nbsp;&nbsp;- <b>Нижний уровень</b> — секции без вложенных (листовые).<br><br>' +
        '• <b>Пропускать безымянные секции</b> — секции без заголовка не обрабатываются (обычно служебные в начале документа).<br><br>' +
        '<span style="color:#CC6600;"><b>ВАЖНО:</b> Из-за структурных особенностей конкретного fb2 документа иногда может быть не проставлена пустая картинка или проставлена лишняя. Требуется ручная проверка.</span><br><br>' +
        '<b>Перед запуском рекомендуется обработать документ скриптом «13_Почистить структуру.js»</b> из папки 08_Структура разделов. После запуска — также рекомендуется.';
}

// Показать/скрыть панель помощи
function toggleHelp() {
    var hp = document.getElementById('helpPanel');
    if (hp.style.display == 'block') {
        hp.style.display = 'none';
    } else {
        updateHelpText();
        hp.style.display = 'block';
    }
}

function doOK() {
    var stepStartVal = document.getElementById('stepStart').value;
    var stepEndVal = document.getElementById('stepEnd').value;
    
    var stepStart = parseInt(stepStartVal, 10);
    if (isNaN(stepStart) || stepStartVal === '' || stepStart < 0) {
        stepStart = -1;
    }
    
    var stepEnd = parseInt(stepEndVal, 10);
    if (isNaN(stepEnd) || stepEndVal === '' || stepEnd < 0) {
        stepEnd = -1;
    }
    
    var modeStart = 'all';
    var radiosStart = document.getElementsByName('modeStart');
    for (var i = 0; i < radiosStart.length; i++) {
        if (radiosStart[i].checked) {
            modeStart = radiosStart[i].value;
            break;
        }
    }
    
    var modeEnd = 'all';
    var radiosEnd = document.getElementsByName('modeEnd');
    for (var j = 0; j < radiosEnd.length; j++) {
        if (radiosEnd[j].checked) {
            modeEnd = radiosEnd[j].value;
            break;
        }
    }
    
    var params = {
        insertStart: document.getElementById('insertStart').checked,
        insertEnd: document.getElementById('insertEnd').checked,
        stepStart: stepStart,
        stepEnd: stepEnd,
        skipStartWithImage: document.getElementById('skipStartWithImage').checked,
        skipEndWithImage: document.getElementById('skipEndWithImage').checked,
        modeStart: modeStart,
        modeEnd: modeEnd,
        skipNameless: document.getElementById('skipNameless').checked
    };
    window.returnValue = params;
    window.close();
}

function doCancel() {
    window.returnValue = null;
    window.close();
}

window.onload = function() {
    document.getElementById('insertStart').focus();
};
</script>
</body>
</html>
