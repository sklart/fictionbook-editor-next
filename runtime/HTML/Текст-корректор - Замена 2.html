 var arg = window.dialogArguments;    //  Получение данных, отправленных из основного скрипта.

 function button_08() {   //  "Статистика"

 if (winStat  &&  !winStat.closed) {    //  Если окно уже открыто...

///////////////   Поиск курсива, жирности, жирного курсива

 var reES = new RegExp("[А-яA-Za-zЁё0-9].*?[А-яA-Za-zЁё0-9]","g");   // Учитывается фрагмент, в котором есть хотя бы две буквы/цифры
 var mBI=[];   //  Массив для жирного курсива.
 var mBIL;   //  Длина этого массива.
 var elem;    //  Один из элементов.
 var s;           //  Текст в элементе.
 var s_;           //  Текст в элементе.
 var s1;           //  Текст в элементе.
 var s2;           //  Текст в элементе.
 var count_EmSt = 0;   //  Счетчик жирного курсива.
 var count_Em = 0;    //  Счетчик курсива.
 var count_St = 0;    //  Счетчик жирности.
 var count_FEmSt = 0;   //  Счетчик фрагментов в жирном курсиве.
 var count_FEm = 0;    //  Счетчик фрагментов в курсиве.
 var count_FSt = 0;    //  Счетчик фрагментов в жирности.
 var count = 0;    //  Вспомогательная переменная.
 var err1 = false;    //  индикатор ошибки.
 var err2 = false;    //  индикатор ошибки.
 var result;      //  Результат поиска.
 var lastInd = reMain.lastIndex;      //  Позиция поиска.
 var j;    //  Счетчики цикла.

 var k;    //  Счетчики цикла.

 var mElem = fbwBody.getElementsByTagName("EM");   //  Массив с элементами курсива.

 for (j=mElem.length-1;  j>=0;  j--) {                  //  Цикл для курсива.
         elem=mElem[j];       //  Элемент курсива.
         if (elem.innerText.search(reES)==-1)   // Если текста мало в курсиве...
                 continue;         //  то переходим к следующему курсиву.
         count_Em++;                                                //  Увеличиваем счетчик.
         s=elem.innerHTML;       //  Текст с тегами внутри курсива.
         if (s.search("<STRONG>")==-1  ||  err1)   //  Если нет фрагментов с жирным курсивом...
                 continue;                            //  то переходим к следующему курсиву.
         mBI = elem.getElementsByTagName("STRONG");   //  Получение массива с жирным курсивом.
         try  { mBIL=mBI.length }      //  Длина этого массива.
         catch(e)  { err1 = true;  continue }    //  * При большом количестве жирного курсива, движок скрипта перестает создавать массивы.
         for (jj=0;  jj<mBIL;  jj++) {                               //  Цикл для жирного курсива.
                 if (mBI[jj].innerText.search(reES)!=-1) {  // Если есть подходящий фрагмент...
                         count_EmSt++;                    //  то увеличиваем счетчик жирного курсива
                         count_St--;          //  и исключаем этот фрагмент из счетчика обычной жирности.
                         }
                 s=s.replace(mBI[jj].outerHTML, "");   //  Убираем фрагмент из курсивного текста.
                 }
         s=s.replace(/<.*?>/g, "");   //  Убираем из курсивного текста все теги.
         if (s.search(reES)==-1)   //  Если оставшийся текст мелковат...
                 count_Em--;           //  то отменяем увеличение счетчика.
         }

 mElem = fbwBody.getElementsByTagName("STRONG");   //  Массив с элементами жирности.

 for (j=mElem.length-1;  j>=0;  j--) {                  //  Цикл для жирности.
         elem=mElem[j];       //  Элемент жирности.

                 continue;         //  то переходим к следующей жирности.
         count_St++;                                                //  Увеличиваем счетчик.
         s=elem.innerHTML;       //  Текст с тегами внутри жирности.
         if (s.search("<EM>")==-1  ||  err2)   //  Если нет фрагментов с жирным курсивом...
                 continue;                            //  то переходим к следующей жирности.
         mBI = elem.getElementsByTagName("EM");   //  Получение массива с жирным курсивом.
         try  { mBIL=mBI.length }      //  Длина этого массива.
         catch(e)  { err2 = true;  continue }    //  * При большом количестве жирного курсива, движок скрипта перестает создавать массивы.
         for (jj=0;  jj<mBIL;  jj++) {                               //  Цикл для жирного курсива.
                 if (mBI[jj].innerText.search(reES)!=-1) {   // Если есть подходящий фрагмент...
                         count_EmSt++;                    //  то увеличиваем счетчик жирного курсива

 function falseFrag(frag) {             //  Функция проверки фрагмента
         switch (numOp) {
             case 921:          //  Преобразование Р а з р я д к и
                 frag = frag.replace(reOp[0], " ");        //  (reSpace) Сохраняем фрагмент с заменой н/р пробелов на обычные.
                 if (frag.search(" ")==-1)   //  Если в фрагменте нет пробелов...
                         return true;                      //  то пропускаем этот фрагмент.
                 if (frag.search(/[—–\-]/)!=-1) {       //  Если в фрагменте есть дефисы/тире
                         if (frag.match(/[—–\-]/g).length  >  frag.match(/ /g).length)    //  и их больше, чем пробелов...
                                 return true;                      //  то пропускаем этот фрагмент.
                         }
                 if (frag.search(reOp[1])==-1)   //  (re921deformat) Если в фрагменте нельзя удалить ни один пробел...
                         return true;                      //  то пропускаем этот фрагмент.
                 frag = frag.replace(/ /g, "");    //  Удаляем из фрагмента все пробелы.
                 if (frag.search(reOp[2])!=-1  ||  frag.search(reOp[3])!=-1)   //  (re921ex1 и re921ex2) Если фрагмент входит в список исключений...
                         return true;                      //  то пропускаем этот фрагмент.
                 if (frag.match(/[А-яA-Za-zЁё]/g).length == 2) {    //  Если в фрагменте только две буквы
                         if (frag.search(reOp[4])==-1)    //  (re921dict) и этого фрагмента нет в словаре...
                                 return true;                      //  то пропускаем этот фрагмент.
                         }
                 break;
                 }
         return false;
         }


 for (h=mP.length-1;  h>=0;  h--) {                //  Цикл для найденных строк.
         mElem = mP[h].getElementsByTagName("EM");   //  Массив с элементами курсива.
         for (j=mElem.length-1;  j>=0;  j--) {                  //  Цикл для курсива.
                 elem=mElem[j];       //  Элемент курсива.
                 s1=elem.innerHTML;       //  Текст внутри курсива.
                 reMain.lastIndex=0;       //  Сброс поиска.
                 count = 0;    //  Сброс счетчика.
                 for (k=0; (result = reMain.exec(s1)) != null; k++) {        //  Запускаем цикл для поиска отдельных фрагментов.
                         if (falseFrag(result[2]))   //  Если фрагмент не может пройти проверку...
                                 continue;        //  то пропускаем этот фрагмент.
                         count++;       //  Увеличиваем счетчик.
                         }
                 if (count == 0)   // Если внутри курсива нет искомых фрагментов...
                         continue;         //  то переходим к следующему курсиву.
                 count_FEm+=count;       //  Увеличиваем счетчик фрагментов в курсиве.
                 if (s1.search("<STRONG>")==-1) {   //  Если внутри курсива нет фрагментов с жирным курсивом...
                         continue;                            //  то переходим к следующему курсиву.
                         }
                 mBI = elem.getElementsByTagName("STRONG");   //  Получение массива с жирным курсивом.
                 for (jj=mBI.length-1;  jj>=0;  jj--) {             //  Цикл для жирного курсива.
                         s2=mBI[jj].innerText;
                         reMain.lastIndex=0;       //  Сброс поиска.
                         count = 0;    //  Сброс счетчика.
                         for (k=0; (result = reMain.exec(s2)) != null; k++) {        //  Запускаем цикл для поиска отдельных фрагментов.
                                 if (falseFrag(result[2]))   //  Если фрагмент не может пройти проверку...
                                         continue;        //  то пропускаем этот фрагмент.
                                 count++;       //  Увеличиваем счетчик.
                                 }
                         if (count == 0)   // Если в жирном курсиве нет искомых фрагментов...
                                 continue;         //  то переходим к следующему жирному курсиву.
                         count_FEmSt+=count;     //  Увеличиваем счетчик фрагментов в жирном курсиве.
                         count_FEm-=count;          //  исключаем то же количество из счетчика фрагментов в курсиве.
                         count_FSt-=count;          //  и исключаем то же количество из счетчика фрагментов в жирности.
                         }
                 }

         mElem = mP[h].getElementsByTagName("STRONG");   //  Массив с элементами жирности.

                 elem=mElem[j];       //  Элемент жирности.
                 s1=elem.innerHTML;       //  Текст внутри жирности.
                 reMain.lastIndex=0;       //  Сброс поиска.
                 count = 0;    //  Сброс счетчика.
                 for (k=0; (result = reMain.exec(s1)) != null; k++) {        //  Запускаем цикл для поиска отдельных фрагментов.
                         if (falseFrag(result[2]))   //  Если фрагмент не может пройти проверку...
                                 continue;        //  то пропускаем этот фрагмент.
                         count++;       //  Увеличиваем счетчик.
                         }
                 if (count == 0)   // Если внутри курсива нет искомых фрагментов...
                         continue;         //  то переходим к следующей жирности.
                 count_FSt+=count;       //  Увеличиваем счетчик фрагментов в жирности.
                 if (s1.search("<EM>")==-1) {   //  Если внутри жирности нет фрагментов с жирным курсивом...
                         continue;                            //  то переходим к следующей жирности.
                         }
                 mBI = elem.getElementsByTagName("EM");   //  Получение массива с жирным курсивом.
                 for (jj=mBI.length-1;  jj>=0;  jj--) {             //  Цикл для жирного курсива.
                         s2=mBI[jj].innerText;
                         reMain.lastIndex=0;       //  Сброс поиска.
                         count = 0;    //  Сброс счетчика.
                         for (k=0; (result = reMain.exec(s2)) != null; k++) {        //  Запускаем цикл для поиска отдельных фрагментов.
                                 if (falseFrag(result[2]))   //  Если фрагмент не может пройти проверку...
                                         continue;        //  то пропускаем этот фрагмент.
                                 count++;       //  Увеличиваем счетчик.
                                 }
                         if (count == 0)   // Если в жирном курсиве нет искомых фрагментов...

                         count_FEmSt+=count;     //  Увеличиваем счетчик фрагментов в жирном курсиве.

                         }
