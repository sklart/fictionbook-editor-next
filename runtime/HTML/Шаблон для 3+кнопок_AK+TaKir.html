 <HTML>
 <HEAD>
 <TITLE>АК-скрипт                                                                                                                                                                                                       </TITLE>
 <META http-equiv="Content-Type" content="text/html; charset=utf-8">
 <STYLE>
 BODY {
	 background: #EBE9ED;
	 margin: 0;
	 padding: 0;
	 font-family: Tahoma, Arial;
	 }
 DIV {
	 margin: 0;
	 padding: 0;
	 }
 P {
	 margin: 0;
	 padding: 0.1em 5px 0.1em 5px;
	 font-size: 10pt;
	 text-align: left;
	 }
 BUTTON {
	 padding: 1px 4px 1px 4px;
	 margin: 0 3px 10px 3px;
	 font-size: 10pt;
	 background: #E8E2D8;
	 width: 110px;
	 }
 </STYLE>
 </HEAD>

 <BODY id=htmlBody>
 <DIV id=htmlDiv style=" padding: 5px 15px 20px 30px;">
 </DIV>
 <DIV id=buttons style="text-align: right; padding: 0 5px 0 15px">
 </DIV>

<SCRIPT>

 //  Состав вводных данных:
 //  0 -- Заголовок окна.
 //  1 -- Массив строк [массив строки, массив строки, массив строки, ...].
     //  Состав строки:
         //  * Пустой массив строки  --  Пустая строка.
         //  0  --  Основной текст (можно не указывать).
         //  1  --  Текст справа (можно не указывать).
         //  2  --  Текст форматирования (можно не указывать).
             //  * Пробелы между кодами обязательны.
             //  * Стиль строки по умолчанию :   ширина строки - 100%,  размер шрифта - 10pt, выравнивание - влево,  цвет шрифта - черный,  фон - прозрачный.
             //  Коды форматирования:
                 //  [число]%влево ;  [число]%вправо ;  [число]%центр  --  Ширина строки (в процентах), и её расположение
                 //  центр ;  вправо ;  ширина  --  Выравнивание по центру, вправо или по ширине.
                 //  отступ  --  Добавление красной строки.
                 //  [число]  --  Размер шрифта (в пунктах).
                 //  #[код_цвета]  --  Цвет шрифта.
                 //  линия#[код_цвета]  --  Линия под строкой, указанного цвета (толщина 1px).
                 //  рамка#[код_цвета]  --  Рамка вокруг строки, указанного цвета (толщина 1px).  * Перекрывает линию.
                 //  жирный  --  Полужирное начертание всей строки.  * Фрагмент строки можно выделить тегом  <B>...</B>.
                 //  курсив  --  Курсивное начертание всей строки.  * Фрагмент строки можно выделить тегом  <I>...</I>.
                 //  подчеркнутый  --  Подчеркивание текста во всей строке.
                 //  разрядка  --  Увеличение разрядки текста на 1px.
                 //  фон#[код_цвета]  --  Цвет фона строки.
                 //  ([имя_шрифта], [имя_резервного_шрифта], ...)  --  Выбор шрифта для строки (круглые скобки обязательны).
             //  * Внутри текста строки также можно применять тег <FONT>...</FONT>, в котором можно указать любой стиль для фрагмента текста (по правилам HTML).
             //  * И есть возможность добавления разрыва строки с помощью тега <BR>.
             //  * Доступны только 4 описанных тега. Их запись возможна как строчными, так и заглавными буквами. Все другие теги внутри строки не подключаются.
         //  ** Пример строки:
         //  ** ["Справка", , "14 центр линия#707070 #1A544F (Cambria, Georgia, Liberation Serif)"]
         //  ** Текст - "Справка". Текст справа отсутствует. Размер шрифта - 14pt, выравнивание по центру, серая линия под текстом, сине-зеленый цвет текста, шрифт "Cambria".
 //  2   и последующие элементы вводных данных  --  Текст кнопок. (кнопки можно не добавлять)
 //  Последний элемент  --  Номер кнопки, которую следует выделить после запуска окна.
     //  * Если запланированы кнопки, то этот номер указывать обязательно.
     //  * Номер  0  означает отсутствие выделенных кнопок.

 //  Нажатие кнопки закрывает окно, и возвращает номер нажатой кнопки основному скрипту.



///////////////   Распределение и первоначальная обработка полученных данных

 var arg = window.dialogArguments;    //  Получение данных, отправленных из основного скрипта.

 var titleArg = arg[0];   //  Заголовок окна.
 if (titleArg)                              //  Если он есть...
         document.title = titleArg+"                                                                                                                                                                                                       ";   //  то добавляем его.

 var M = arg[1];          //  Массив строк и их форматов.

 var i;   //  Счетчик цикла.
 var mFocus = [htmlDiv];          //  Массив строк и их форматов.
 for (i=2; i<arg.length-1; i++) {
         buttons.insertAdjacentHTML("beforeEnd", '<BUTTON id=b'+(i-1)+' onclick="window.returnValue='+(i-1)+'; window.close()">'+arg[i]+'</BUTTON>')
         mFocus.push(document.getElementById("b"+(i-1)));
         }

 var focusButton = arg[i];   //  Фокусировка.



///////////////   Добавление текста

 var div = document.getElementById("htmlDiv");    //  Раздел, где будет размещен весь текст.
 var emptyLine=false;    //  Индикатор пустой строки.
 var txt="";       //  Текстовая запись структуры.
 var textStyle="";    //  Текст параметра "style" (текстовая запись форматирования строки).


 for (i=0; i<M.length; i++) {     //  Цикл для строк

         M[i][0] = inCode(M[i][0]);   //  Коррекция основного текста строки (слева)
         M[i][1] = inCode(M[i][1]);   //  Коррекция дополнительного текста строки (справа)

         if (M[i][2] == undefined  ||  M[i][2] == null)   //  Если формат строк не определяется, или его не существует...
                 M[i][2] = "";           //  то заменяем его на пустой текст.
             else  M[i][2] += "";    //  В противном случае, преобразуем данные форматирования в текст.

         if (!M[i][0]  &&  !M[i][1]) {    //  Если обе части строки пустые (или не определяются, или не существуют)...
                 emptyLine=true;       //  то включаем индикатор пустой строки
                 continue;              //  и переходим к анализу данных о следующей строке.
                 }

         if (!M[i][0]) {     //  Если основной текст строки отсутствует...
                 M[i][0] = M[i][1];   //  то заимствуем его из дополнительной части текста,
                 M[i][1] = "";            //  удаляем дополнительную часть
                 M[i][2]+=" вправо";   //  и добавляем формат выравнивания текста вправо.
                 }


         txt+="<P";     //  Добавляем начало строки.
         textStyle="";     //  Создаем новый текст параметра "style"

         if (emptyLine) {           //  Если предыдущая строка пустая...
                 textStyle += "margin-top: 0.9em; ";   //  то увеличиваем внешнее поле строки
                 emptyLine=false;           //  и гасим индикатор пустой строки.
                 }

         if (M[i][2].search(/(^| )\d+%(влево|вправо|центр)( |$)/)>=0) {    //  Если в форматировании указана ширина текста...
                 padd = 100 - M[i][2].replace(/^(|.*? )(\d+)%(влево|вправо|центр)( .*?|)$/i, "$2");   //  то определяем общую ширину внутренних полей.
                 switch (M[i][2].replace(/^(|.*? )(\d+)%(влево|вправо|центр)( .*?|)$/i, "$3").toLowerCase()) {      //  Определяем положение строки, и в зависимости от результата...
                     case "влево":
                         textStyle += "margin-right: "+padd+"%; ";   //  или добавляем внешнее поле справа,
                         break;
                     case "вправо":
                         textStyle += "margin-left: "+padd+"%; ";   //  или добавляем внешнее поле слева,
                         break;
                     case "центр":
                         textStyle += "margin-left: "+(padd*0.5)+"%; margin-right: "+(padd*0.5)+"%; ";   //  или добавляем равные внешние поля слева и справа.
                         break;
                         }
                 }

         if (M[i][2].search(/(^| )центр( |$)/i)>=0)     //  Если в форматировании указано выравнивание текста по центру...
                 textStyle += "text-align: center; ";       //  то добавляем соответствующий параметр.

         if (M[i][2].search(/(^| )ширина( |$)/i)>=0)     //  Если в форматировании указано выравнивание текста по ширине...
                 textStyle += "text-align: justify; ";       //  то добавляем соответствующий параметр.

         if (M[i][2].search(/(^| )вправо( |$)/i)>=0)     //  Если в форматировании указано выравнивание текста по правому краю...
                 textStyle += "text-align: right; ";       //  то добавляем соответствующий параметр.

         if (M[i][2].search(/(^| )отступ( |$)/i)>=0)    //  Если в форматировании указано добавление красной строки...
                 textStyle += "text-indent: 1.5em; ";       //  то добавляем соответствующий параметр.

         if (M[i][2].search(/(^| )\d+( |$)/)>=0)    //  Если в форматировании указан размер шрифта...
                 textStyle += "font-size: "+M[i][2].replace(/^(|.*? )(\d+)( .*?|)$/, "$2")+"pt; ";   //  то добавляем соответствующий параметр.

         if (M[i][2].search(/(^| )#[0-9A-F]+( |$)/i)>=0)    //  Если в форматировании указан цвет шрифта...
                 textStyle += "color: "+M[i][2].replace(/^(|.*? )(#[0-9A-F]+)( .*?|)$/i, "$2")+"; ";   //  то добавляем соответствующий параметр.

         if (M[i][2].search(/(^| )линия#[0-9A-F]+( |$)/i)>=0)    //  Если в форматировании указано добавление линии...
                 textStyle += "border-bottom: 1px solid "+M[i][2].replace(/^(|.*? )линия(#[0-9A-F]+)( .*?|)$/i, "$2")+"; ";   //  то добавляем соответствующий параметр.

         if (M[i][2].search(/(^| )рамка#[0-9A-F]+( |$)/i)>=0)    //  Если в форматировании указано добавление рамки...
                 textStyle += "border: 1px solid "+M[i][2].replace(/^(|.*? )рамка(#[0-9A-F]+)( .*?|)$/i, "$2")+"; ";   //  то добавляем соответствующий параметр.

         if (M[i][2].search(/(^| )жирный( |$)/i)>=0)    //  Если в форматировании указано добавление жирности...
                 textStyle += "font-weight: bold; ";   //  то добавляем соответствующий параметр.

         if (M[i][2].search(/(^| )курсив( |$)/i)>=0)    //  Если в форматировании указано добавление курсива...
                 textStyle += "font-style: italic; ";   //  то добавляем соответствующий параметр.

         if (M[i][2].search(/(^| )подч[её]ркнутый( |$)/i)>=0)    //  Если в форматировании указано добавление подчеркивания...
                 textStyle += "text-decoration: underline; ";   //  то добавляем соответствующий параметр.

         if (M[i][2].search(/(^| )разрядка( |$)/i)>=0)    //  Если в форматировании указано увеличение разрядки...
                 textStyle += "letter-spacing: 1px; ";   //  то добавляем соответствующий параметр.

         if (M[i][2].search(/(^| )фон#[0-9A-F]+( |$)/i)>=0)    //  Если в форматировании указан фон строки...
                 textStyle += "background: "+M[i][2].replace(/^(|.*? )фон(#[0-9A-F]+)( .*?|)$/i, "$2")+"; ";   //  то добавляем соответствующий параметр.

         if (M[i][2].search(/(^| )\(.+?\)( |$)/i)>=0)    //  Если в форматировании указан ряд шрифтов...
                 textStyle += "font-family: "+M[i][2].replace(/^(|.*? )\((.+?)\)( .*?|)$/i, "$2")+"; ";   //  то добавляем соответствующий параметр.

         if (textStyle)      //  Если в тексте параметров что-то есть...
                 txt+=' style="'+textStyle.replace(/..$/, '')+'"';   //  то добавляем в строку текст с параметрами стиля.

         txt+= ">";        //  Закрываем начальный тег строки "<P>"

         if (M[i][1])               //  Если есть дополнительная (правая) часть строки...
                 txt += '<FONT style="float: right"> '+M[i][1]+'</FONT>';   //  то добавляем её с соответствующим форматированием.

         txt+= M[i][0] + "</P>";     //  Добавляем в строку основной текст (левый), и добавляем закрывающий тег строки.

         }    //  Конец цикла для строк.

 div.innerHTML = txt;    //  Полученный текст вставляем в основной раздел.



///////////////   ФУНКЦИИ

 //  После загрузки окна...

 window.onload = function() {
         if (arg.length>3) {
                 var wHeight = htmlBody.clientHeight;   //  Высота окна.
                 var coord=buttons.getBoundingClientRect();                   //  Получение координат элемента.
                 div.style.height = wHeight - (coord.bottom - coord.top);
                 focus();
                 mFocus[focusButton].focus();                            //  Переносим фокус на указанную кнопку.
                 }
         htmlBody.scrollTop =0;           //  Весь текст прокручиваем в начало.
         //  window.clipboardData.setData("text", htmlBody.firstChild.outerHTML.replace(/> ?</g, ">\n<"));    //  -- Посмотреть полученную структуру через буфер обмена.
         }


 //   Функция коррекции текста для отображения в HTML

 function inCode(text) {
         if (text == undefined  ||  text == null)   //  Если "text" не определяется, или его не существует...
                 text = "";           //  то заменяем его на пустой текст.
             else  text += "";    //  В противном случае, преобразуем "text" в текст.
         text = text.replace(/&/g, "&amp;").replace(/ /g, "&nbsp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/­/g, "&shy;");      //  Преобразование некоторых символов в код.
         text = text.replace(/&lt;(\/?[Bb]|\/?[Ii]|BR|br)&gt;/g, "<$1>");   //  Возвращаем тег жирности, курсива, разрыва строки.
         text = text.replace(/&lt;(\/FONT|\/font|(FONT|font) .+?)&gt;/g, "<$1>");   //  Возвращаем теги FONT.
         return  text;
         }


</SCRIPT>
</BODY>
</HTML>
