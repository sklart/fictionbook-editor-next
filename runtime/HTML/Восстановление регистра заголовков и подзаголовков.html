///////////////    Функция  уменьшения  иллюстраций

 function miniImg(s) {
         var reId = new RegExp("(<IMG[^<>]* src=\"([^\"]+))\"([^<>]*>)", "g");   //  Разбор элемента IMG.
         var rS;      //  Результат детального поиска.
         var k;       //  Счетчик цикла.
     LBL:
         for (reId.lastIndex = 0;   (rS = reId.exec(s)) != null;  reId.lastIndex = rS.index+10) {       //  Цикл для иллюстраций в строке.
                 if (rS[2].substring(0, 14) != "fbw-internal:#") {                                             //  Если в начале адреса нет этого текста...
                         s = s.substring(0, rS.index) + rS[1] + " height=1\"" + rS[3] + s.substring(reId.lastIndex);     //  то это внешняя иллюстрация -- блокируем её
                         continue;                           //  и переходим к следующей иллюстрации в строке.
                         }
                 rS[2] = rS[2].substring(14);           //  Получаем id иллюстрации.
                 for (k=mImgId.length-1; k>=0; k--)     //  Цикл для id всех иллюстраций книги.
                         if (mImgId[k] == rS[2]) {                            //  Если есть совпадение индексов...
                                 s = s.substring(0, rS.index) + rS[1] + "\" height=" + mImgH[k] + " width=" + mImgW[k] + rS[3] + s.substring(reId.lastIndex);   //  то изменяем размеры картинки
                                 continue LBL;                       //  и переходим к следующей иллюстрации в строке.
                                 }
                 s = s.substring(0, rS.index) + rS[1] + " height=1\"" + rS[3] + s.substring(reId.lastIndex);      //  Если совпадения индексов нет -- блокируем иллюстрацию.
                 }
         return  s;    //  Возвращаем строку с уменьшенными иллюстрациями.
         }

         }

                                     else  L2 = LMidi;        //  Если участки не совпадают -- изменяем наибольшую длину на среднее значение.

                 mOldTxt.splice(k, 1,   frag2.substring(0, mR[1]),    "</FONT>" + frag2.substring(mR[1], mR[1] + mR[2]) + "<FONT>",    frag2.substring(mR[1] + mR[2]));

///////////////   СВЕРКА :  Функция :  2-й метод сверки (лучший)

function compare2() {

 //  * Отличительная особенность метода в том, что алгоритм в первую очередь ищет совпадающие участки текста максимальной длины. Таким способом несовпадающий участок может быть раздроблен на три участка: один совпадающий и два несовпадающих. Эти два, в свою очередь, тоже могут быть раздроблены тем же способом на три участка... и так далее, до до тех пор, пока скрипт не сможет найти совпадающий участок ни в одном несовпадающем участке.

LBL1:
 for (k=1; ; ) {      //  Запускаем цикл для текстов несовпадающих участков из массива с финальными результатами.

             else {               //  А если больше...

                 frag2 = mOldTxt[k];

         L1 = minSim-1;                    //  Исходное значение  для наименьшей длины участка.
         L2 = Math.min(LParent[k], frag1.length)+1;    //  Исходное значение  для наибольшей длины участка.  // * Не может привышать длину родительского совпадающего участка.
         mRR = [];             //  Очищаем массив результата  с  совпадающем участком   максимальной   длины.

         while (L2-L1 >= 2) {                                        //  Цикл, который будет выполняться, пока значения наименьшей и наибольшей длины участка не встанут рядом.
                 LMidi = Math.floor((L2+L1)/2);          //  Получение средней длины (между наименьшей и наибольшей длиной).
                 mR = [];             //  Очищаем массив результата  с  совпадающем участком   заданной   длины.

LBL2:
                 for (pos1 = 0;  pos1 <= frag1.length - LMidi;  pos1++) {        //  Запускаем цикл для позиции суб-фрагмента в 1-м фрагменте.
                         subFrag = frag1.substring(pos1, pos1 + LMidi);          //  Получаем суб-фрагмент заданной длины на текущей позиции.

                         if ((frag2.indexOf(subFrag)) != -1) {                                   //  Если текст суб-фрагмента можно найти во 2-м фрагменте, т.е. это совпадающий участок...

                                 if (frag1.substring(pos1).search(/^[^<>]*>/) != -1) {      //  Если в    (совпадающий + 2-й несовпадающий)    есть конфликтная скобка (для frag1 (!))...
                                         pos1 += /^[^<>]*>/.exec(frag1.substring(pos1))[0].length-1;     //  Увеличиваем позицию на длину конфликтного участка, минус поправка для счетчика.
                                         continue;                                     //  Переходим к поиску следующего суб-фрагмента заданной длины.

                                 if (frag2.substring(pos2).search(/^[^<>]*>/) != -1) {      //  Если в    (совпадающий + 2-й несовпадающий)    есть конфликтная скобка (для frag2 (!))...
                                         var frag_2;                                //  Вводим переменную для укороченного фрагмента.

                                                 pos1 += /^[^<>]*<[^<>]*>/.exec(frag1.substring(pos1))[0].length-1;   //  Увеличиваем позицию на длину конфликтного участка, минус поправка.
                                                 continue;                                     //  Переходим к поиску следующего суб-фрагмента заданной длины.

                                         //  Сохраняем промежуточный результат.

                                         mR[1] = pos2;     //  Позиция совпадающего участка во 2-м фрагменте.
                                         mR[2] = subFrag.search(/<[^<>]*$/);    //  Длина совпадающего участка без обрывка тега (для выделения FONT).
                                         mR[3] = LMidi;     //  Вся длина совпадающего участка (для максимальной длины дочерних совпадающих участков).
                                         break;         //  Прерываем цикл поиска совпадающего участка заданной длины.
                                         }

                                 if (subFrag.replace(/<[^<>]*>/g, "").length < minSim) {            //  Если совпадающий участок без тегов меньше заданной минимальной длины...
                                         pos1 += /^[^<>]*<[^<>]*>/.exec(frag1.substring(pos1))[0].length-1;   //  Добавляем к позиции длину первого тега, минус поправка.
                                         continue;                                     //  Переходим к поиску следующего суб-фрагмента заданной длины.
                                         }

                                 //  Сохраняем промежуточный результат.
                                 mR[0] = pos1;     //  Позиция совпадающего участка в 1-м фрагменте.

                                 break;         //  Прерываем цикл поиска совпадающего участка заданной длины.

                 if (mR.length != 0) {    //  Если цикл выдал результат...
                         L1=LMidi;                    //   Изменяем наименьшую длину на среднее значение.
                         for (h=0; h<=4; h++)  mRR[h] = mR[h];    //  Сохраняем промежуточный результат.

                     else                //  Если нет результата...
                         L2=LMidi;               //  Изменяем наибольшую длину на среднее значение.

                 while (mOldTxt[(k=k+2)] != undefined) {             //  Проверяем в массиве  наличие следующего несовпадающего участка.
                         if ((mOldTxt[k].length + ":" + mModTxt[k].length).search(/^0:|:0$|^1:1$|^1:2$|^2:1$/) == -1)
                         //  Если участки не из тех, где...  или один из участков нулевой длины, или оба состоят из 1 символа, или один участок - 1 символ, а другой - 2 символа...
                                 continue LBL1;           //  то переходим к очередному дроблению несовпадающего участка.

                 break;           //  Если следующий участок так и не найден  --  Прерываем основной цикл.

             else {            //  Если основной цикл выдал результаты...

///////////////   СВЕРКА :  Функция :  Финальная коррекции тегов <FONT> и сборка текста строк.

 function correction(mTxt) {
         var rS;                 //  Результат детального поиска.
         var k;                       //  Счетчик цикла.
         var styleTxt = "";        //  Сборная строка с форматами <FONT> сверки.

         for (k=0; k<mTxt.length; k++)      //  Запускаем цикл для участков текста.
                 styleTxt += mTxt[k];         //  Собираем участки в одну строку.

         styleTxt = styleTxt.replace(/&/g, "&amp;").replace(/ /g, nbspEntity).replace(/\t/g, "&lt;").replace(/\r/g, "&gt;").replace(/­/g, "&shy;");

                 //  Поиск соседних тегов.   При конфликте тегов -- добавление тегов  <FONT>
         var re01 = new RegExp("(<[^<>]+>)([^<>]*)(<[^<>]+>)", "g");
         for (re01.lastIndex = 0;   (rS = re01.exec(styleTxt)) != null; )    //  Запускаем цикл для детального поиска соседних тегов.
                 if (rS[1] == "<FONT>"  &&  rS[3] != "</FONT>") {                   //  Если нет пары для начального тега <FONT>...
                         styleTxt = styleTxt.substring(0, rS.index) + rS[1] + rS[2] + "</FONT>" + rS[3] + "<FONT>" + styleTxt.substring(re01.lastIndex);
                         //  То добавляем два тега  </FONT> и <FONT>  вокруг второго местного тега (не FONT).
                         re01.lastIndex += 7;   //  Корректируем начало поиска следующих соседних тегов.
                         }

                 //  Объединение примыкающих элементов  FONT.
         var re02 = new RegExp("</FONT><FONT>", "g");
         var re02_ = "";
         styleTxt = styleTxt.replace(re02, re02_);

                 //  Поиск примыкающих элементов  FONT (через другой тег)   и   удаление лишних.
         var re03 = new RegExp("<FONT></FONT>((<[^<>]+>)+?<FONT>)", "g");
         var re03_ = "$1";
         while (styleTxt.search(re03) != -1)
                 styleTxt = styleTxt.replace(re03, re03_);

         var re04 = new RegExp("(</FONT>(<[^<>]+>)+?)<FONT></FONT>", "g");
         var re04_ = "$1";
         while (styleTxt.search(re04) != -1)
                 styleTxt = styleTxt.replace(re04, re04_);

                 //  Изменение стиля пустого элемента FONT -- добавление синей узкой линии.
         var re05 = new RegExp("<FONT></FONT>", "g");
         var re05_ = '<FONT style="width=1; background: #59A3FF;"></FONT>';

                 //  Изменение стиля элемента FONT с одним символом ударения -- добавление красной узкой линии.
         var re06 = new RegExp("<FONT>("+String.fromCharCode(769)+")</FONT>", "g");
         var re06_ = '<FONT style="padding-right: 1; background: #FF9999;">$1</FONT>';

         styleTxt = styleTxt.replace(re05, re05_).replace(re06, re06_);

         return styleTxt;    //  Возвращаем готовый текст.
         }

 var mTxt = mTxt1.concat(mTxt2, mTxt3);    //  Объединяем все разделы в один массив.


 //  Запускаем окно справки.
 winInfo = window.showModelessDialog( "АК-скрипт - Сообщение.html", [titleMsg, mTxt],
         "dialogHeight: "+heightInfo+"px; dialogWidth: 350px; dialogLeft: "+(window.screenLeft+698)+"; dialogTop: "+(window.screenTop-delta)+"; center: Yes; help: No; resizable: Yes; status: No");
