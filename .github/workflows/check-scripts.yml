name: Check embedded scripts

on:
  push:
    branches: [master]
    paths:
      - "runtime/**/*.js"
      - "runtime/**/*.html"
      - "runtime/**/*.htm"
      - "tools/lint-scripts/**"
      - "eslint.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/check-scripts.yml"
  pull_request:
    paths:
      - "runtime/**/*.js"
      - "runtime/**/*.html"
      - "runtime/**/*.htm"
      - "tools/lint-scripts/**"
      - "eslint.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/check-scripts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:scripts
      - run: npm run test:lint-scripts:fingerprint
      - run: npm run test:lint-scripts:jscript
