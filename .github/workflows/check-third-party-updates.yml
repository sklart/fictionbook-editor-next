name: Check third-party updates

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Check third-party libraries and dictionaries
        shell: pwsh
        run: .\tools\build\check-third-party-updates.ps1 -WarnOnUpdate
