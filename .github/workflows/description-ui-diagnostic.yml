name: Description paste UI diagnostic
on:
  push:
    branches: [codex/3.0.12-description-paste]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  affected:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 45700383616
          name: description-paste-runtime-07c7fe0764e789b0ec5ec2b784f52db154ff2ef0
          path: out/Release
      - name: Run affected editor regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/tests/test-fbe-clipboard-paste-runtime.ps1
          ./tools/tests/test-fbe-clipboard-title-paste-runtime.ps1
          ./tools/tests/test-fbe-html-paste-runtime.ps1 -RealPaste
          ./tools/tests/test-fbe-clipboard-fallback-runtime.ps1
          ./tools/tests/test-fbe-clipboard-paste-boundary.ps1
          ./tools/tests/test-fbe-description-input-undo-probe.ps1
          ./tools/tests/test-fbe-description-custom-undo-probe.ps1
          ./tools/tests/test-description-roundtrip.ps1
          ./tools/tests/test-description-idle-contract.ps1
          ./tools/tests/test-fbe-scripting-clipboard-ole-ci.ps1 -FullNativeMatrix
      - name: Preserve regression diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: description-affected-${{ github.sha }}
          path: |
            out/tests/runtime-failure/
            out/tests/clipboard-ole/
            build/community-feedback-html-paste/
          if-no-files-found: warn
  queue:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 45700383616
          name: description-paste-runtime-07c7fe0764e789b0ec5ec2b784f52db154ff2ef0
          path: runtime
      - name: Exercise queued paste across description transitions
        shell: pwsh
        run: ./tools/tests/test-fbe-html-paste-runtime.ps1 -FbeExe runtime/FBE.exe -RealPaste -Cases queue-description-focus,queue-description-reentrant
      - name: Preserve queue diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: description-queue-diagnostic-${{ github.sha }}
          path: |
            build/community-feedback-html-paste/
            out/tests/runtime-failure/
          if-no-files-found: warn
  ui:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 45700383616
          name: description-paste-runtime-07c7fe0764e789b0ec5ec2b784f52db154ff2ef0
          path: runtime
      - name: Exercise metadata controls and paste entry points
        shell: pwsh
        run: |
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tools/tests/test-fbe-description-clipboard-runtime.ps1 -RuntimeDirectory runtime -ExpectFixed
          if ($LASTEXITCODE -ne 0) { throw 'Metadata UI diagnostic failed.' }
