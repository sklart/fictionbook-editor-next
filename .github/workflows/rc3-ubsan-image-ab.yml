name: RC3 UBSan ImageImport A-B diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Require hosted runner
        shell: pwsh
        run: if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Disposable runner required.' }
      - name: Prepare compiler and dependencies
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          ./tools/build/prepare-ubsan-llvm.ps1
          ./tools/build/prepare-ubsan-type-libraries.ps1
          ./tools/build/build-libwebp.ps1 -Configuration Release -PlatformToolset v143
          ./tools/build/build-openjpeg.ps1 -Configuration Release -PlatformToolset v143
          ./tools/build/build-libheif.ps1 -Configuration Release -PlatformToolset v143
      - name: Compare ImageImport smoke on the same runner
        shell: pwsh
        run: ./tools/rc3-acceptance/test-ubsan-image-ab.ps1
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rc3-ubsan-image-ab
          path: |
            out/tests/rc3-ubsan-image-ab/**
            out/tests/runtime-failure/**
          if-no-files-found: warn
          retention-days: 14
