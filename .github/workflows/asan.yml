name: AddressSanitizer

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '17 2 * * 1'
  workflow_call:
    inputs:
      full_validation:
        type: boolean
        default: false
        required: false
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run the extended sanitizer runtime contour
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: asan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  asan:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Record and verify source before build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/tests/asan | Out-Null
          $status = @(git status --porcelain=v1 --untracked-files=no)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect source status before build.' }
          [IO.File]::WriteAllLines((Join-Path (Get-Location) 'out/tests/asan/source-before.log'), [string[]]$status)
          if ($status.Count) { throw 'Source is dirty before build.' }
      - name: Build isolated Release Win32 AddressSanitizer
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          New-Item -ItemType Directory -Force out/tests/asan | Out-Null
          $watch = [Diagnostics.Stopwatch]::StartNew()
          try {
            ./tools/build/build.ps1 -Configuration Release -Platform Win32 -PlatformToolset v143 -Sanitizer Address *> out/tests/asan/build.log
            if (-not $? -or $LASTEXITCODE -ne 0) { throw 'ASan build failed; see build.log' }
          } finally { $watch.Stop(); "ASan build: $([math]::Round($watch.Elapsed.TotalSeconds, 1)) s." >> $env:GITHUB_STEP_SUMMARY }
      - name: Validate sanitizer policy and production package rejection
        shell: pwsh
        run: ./tools/tests/test-sanitizer-build-policy.ps1 *> out/tests/asan/build-policy.log
      - name: Run native regressions for confirmed memory defects
        shell: pwsh
        run: ./tools/tests/test-asan-regressions-native.ps1 -Sanitizer Address
      - name: Record and reconcile verified MIDL output
        shell: pwsh
        run: |
          git status --porcelain=v1 --untracked-files=no | Set-Content out/tests/asan/source-after.log
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect source status after build.' }
          git diff HEAD --binary --output=out/tests/asan/source-after.patch
          if ($LASTEXITCODE -ne 0) { throw 'Cannot record source diff.' }
          ./tools/rc3-acceptance/ReconcileMidl.ps1 -RepositoryRoot . -EvidenceDirectory out/tests/asan -ExpectedSource $env:GITHUB_SHA
          $remaining = @(git status --porcelain=v1 --untracked-files=no)
          if ($LASTEXITCODE -ne 0 -or $remaining.Count) { throw 'Tracked source or submodules remain dirty.' }
      - name: Run focused sanitizer checks
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type != 'tag') || ((github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && !inputs.full_validation)
        shell: pwsh
        run: ./tools/tests/invoke-sanitizer-ci.ps1 -Sanitizer Address -Focused
      - name: Run sanitizer FULL
        if: github.ref_type == 'tag' || github.event_name == 'schedule' || ((github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.full_validation)
        shell: pwsh
        run: ./tools/tests/invoke-sanitizer-ci.ps1 -Sanitizer Address -AllowUserComRegistration
      - name: Ensure build failures also have a summary
        if: always()
        shell: pwsh
        env:
          ASAN_JOB_STATUS: ${{ job.status }}
        run: |
          New-Item -ItemType Directory -Force out/tests/asan | Out-Null
          $summaries = @(Get-ChildItem out/tests/asan -Recurse -Filter summary.json)
          if (-not $summaries.Count) {
            @{status='FAIL'; sanitizer='Address'; commit=$env:GITHUB_SHA; stage='build or infrastructure'; log='build.log'} |
              ConvertTo-Json | Set-Content out/tests/asan/summary.json -Encoding utf8
          }
          @{status=$env:ASAN_JOB_STATUS; sanitizer='Address'; commit=$env:GITHUB_SHA; summaries=@($summaries.FullName)} |
            ConvertTo-Json | Set-Content out/tests/asan/ci-summary.json -Encoding utf8
          $env:SANITIZER_JOB_STATUS = $env:ASAN_JOB_STATUS
          ./tools/tests/write-sanitizer-ci-summary.ps1 -Directory asan
      - name: Upload sanitizer summaries
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: asan-summary
          path: |
            out/tests/asan/ci-summary.json
            out/tests/asan/**/summary.json
            out/tests/asan/**/result.json
            out/tests/asan/source-before.log
            out/tests/asan/source-after.log
            out/tests/asan/source-after.patch
            out/tests/asan/midl-reconciliation.json
            out/asan/Release/fbe-sanitizer.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload sanitizer failure logs and dumps
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: asan-diagnostics
          path: |
            out/tests/asan/**/*.log
            out/tests/asan/**/asan.*
            out/tests/asan/**/*.dmp
            out/tests/asan/**/case.json
            out/tests/asan/**/*.patch
            out/tests/asan/midl-reconciliation.json
          if-no-files-found: error
          retention-days: 14
