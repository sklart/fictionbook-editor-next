name: Description paste baseline diagnostic
on:
  workflow_dispatch:
  push:
    branches: [codex/3.0.12-description-paste]
permissions:
  contents: read
  actions: read
jobs:
  baseline:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 45631151901
          name: FictionBookEditorNext-2cb31d085927df30a0e82cd9958c73b57478ce49-release
          path: baseline
      - name: Exercise released editor on a clean Windows runner
        shell: pwsh
        run: |
          $zip = Get-ChildItem baseline -Recurse -Filter '*-portable.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Original portable archive missing.' }
          if ((Get-FileHash $zip.FullName).Hash -ne '6938153e1c40acecf0b7fec901f14684012be2268dfa75390c72e1fe769261a9') { throw 'Original archive hash mismatch.' }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath baseline/runtime
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tools/tests/description-paste-baseline-diagnostic.ps1 -RuntimeDirectory baseline/runtime
          if ($LASTEXITCODE -ne 0) { throw 'Baseline diagnostic failed.' }
  candidate:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build candidate with strict warnings
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          New-Item -ItemType Directory -Force out/tests/description-paste | Out-Null
          ./tools/build/build.ps1 -Configuration Release -Platform Win32 -SkipUpx -SkipVersionSync -WarningsAsErrors -StrictFirstPartyWarnings *> out/tests/description-paste/build.log
          if (-not $? -or $LASTEXITCODE -ne 0) { throw 'Candidate build failed.' }
      - name: Check metadata insertion in real editor
        shell: pwsh
        run: |
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tools/tests/description-paste-baseline-diagnostic.ps1 -RuntimeDirectory out/Release -ExpectFixed
          if ($LASTEXITCODE -ne 0) { throw 'Candidate diagnostic failed.' }
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: description-paste-candidate-diagnostics
          path: out/tests/description-paste/
          if-no-files-found: warn
