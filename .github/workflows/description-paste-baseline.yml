name: Description paste baseline diagnostic
on:
  workflow_dispatch:
  push:
    branches: [codex/3.0.12-description-paste]
permissions:
  contents: read
  actions: read
jobs:
  saved-file-diagnostic:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: d985e671431e3aaf23c5186321613da05aae217d
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 45695651081
          name: description-paste-runtime-d985e671431e3aaf23c5186321613da05aae217d
          path: out/Release
      - name: Probe save on already built candidate
        shell: pwsh
        run: |
          $source = [IO.File]::ReadAllText('tools/tests/test-fbe-description-clipboard-runtime.ps1')
          $original = "[System.Windows.Forms.SendKeys]::SendWait('^s')"
          if (-not $source.Contains($original)) { throw 'Save probe insertion point not found.' }
          $replacement = '[void][BaselineWindow]::PostMessage($process.MainWindowHandle, 0x111, [IntPtr]0xE103, [IntPtr]::Zero)'
          $source = $source.Replace($original, $replacement)
          [IO.File]::WriteAllText('out/save-probe.ps1', $source, [Text.UTF8Encoding]::new($false))
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File out/save-probe.ps1 -RuntimeDirectory out/Release -ExpectFixed
          if ($LASTEXITCODE -ne 0) { throw 'Save probe failed.' }
      - name: Preserve saved fixture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: description-save-probe
          path: |
            out/Release/description-paste-fixture.fb2
            out/Release/Data/Diagnostics/
          if-no-files-found: warn
  queued-paste-diagnostic:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: d985e671431e3aaf23c5186321613da05aae217d
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 45695651081
          name: description-paste-runtime-d985e671431e3aaf23c5186321613da05aae217d
          path: out/Release
      - name: Exercise queued paste and focus transition
        shell: pwsh
        run: ./tools/tests/test-fbe-html-paste-runtime.ps1 -Cases @('queue-description-focus') -KeepArtifacts
      - name: Preserve queued-paste diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: description-queued-paste-probe
          path: |
            out/tests/runtime-failure/
            build/community-feedback-html-paste/
          if-no-files-found: warn
  baseline:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 45631151901
          name: FictionBookEditorNext-2cb31d085927df30a0e82cd9958c73b57478ce49-release
          path: baseline
      - name: Exercise released editor on a clean Windows runner
        shell: pwsh
        run: |
          $zip = Get-ChildItem baseline -Recurse -Filter '*-portable.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Original portable archive missing.' }
          if ((Get-FileHash $zip.FullName).Hash -ne '6938153e1c40acecf0b7fec901f14684012be2268dfa75390c72e1fe769261a9') { throw 'Original archive hash mismatch.' }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath baseline/runtime
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tools/tests/test-fbe-description-clipboard-runtime.ps1 -RuntimeDirectory baseline/runtime
          if ($LASTEXITCODE -ne 0) { throw 'Baseline diagnostic failed.' }
  candidate:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build candidate with strict warnings
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          New-Item -ItemType Directory -Force out/tests/description-paste | Out-Null
          ./tools/build/build.ps1 -Configuration Release -Platform Win32 -SkipUpx -SkipVersionSync -WarningsAsErrors -StrictFirstPartyWarnings *> out/tests/description-paste/build.log
          if (-not $? -or $LASTEXITCODE -ne 0) { throw 'Candidate build failed.' }
      - name: Preserve candidate runtime
        uses: actions/upload-artifact@v7
        with:
          name: description-paste-runtime-${{ github.sha }}
          path: out/Release/
          if-no-files-found: error
          retention-days: 3
      - name: Check metadata insertion in real editor
        shell: pwsh
        run: |
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tools/tests/test-fbe-description-clipboard-runtime.ps1 -RuntimeDirectory out/Release -ExpectFixed
          if ($LASTEXITCODE -ne 0) { throw 'Candidate diagnostic failed.' }
      - name: Run affected editor regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/tests/test-fbe-clipboard-paste-runtime.ps1
          ./tools/tests/test-fbe-clipboard-title-paste-runtime.ps1
          ./tools/tests/test-fbe-html-paste-runtime.ps1 -RealPaste
          ./tools/tests/test-fbe-clipboard-fallback-runtime.ps1
          ./tools/tests/test-fbe-clipboard-paste-boundary.ps1
          ./tools/tests/test-fbe-description-input-undo-probe.ps1
          ./tools/tests/test-fbe-description-custom-undo-probe.ps1
          ./tools/tests/test-description-roundtrip.ps1
          ./tools/tests/test-description-idle-contract.ps1
          ./tools/tests/test-fbe-scripting-clipboard-ole-ci.ps1 -FullNativeMatrix
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: description-paste-candidate-diagnostics
          path: |
            out/tests/description-paste/
            out/tests/runtime-failure/
            out/tests/clipboard-ole/
            build/community-feedback-html-paste/
          if-no-files-found: warn
