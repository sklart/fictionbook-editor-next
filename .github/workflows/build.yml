name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  validate:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Check generated version files and pipeline structure
        shell: pwsh
        run: |
          ./tools/version/sync-version.ps1
          git diff --exit-code -- packaging/nsis/Installer/version.nsh
          ./tools/tests/test-release-pipeline-deduplication.ps1
          ./tools/build/verify-nsis-layout.ps1

  build:
    needs: validate
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Restore third-party build cache
        uses: actions/cache@v4
        with:
          path: |
            build/pcre2
            build/hunspell/lib
            out/editor-runtime
          key: ${{ runner.os }}-release-win32-v143-modern-win7-${{ hashFiles('third_party/pcre2/**', 'third_party/hunspell/**', 'third_party/scintilla/**', 'third_party/lexilla/**', 'tools/build/build-pcre2.ps1', 'tools/build/build-hunspell.ps1', 'tools/build/build-scintilla.ps1') }}
      - name: Build Release Win32 modern
        shell: pwsh
        run: ./tools/build/build.ps1 -Configuration Release -Platform Win32 -CompatibilityTarget Modern -PlatformToolset v143 -SkipUpx -WarningsAsErrors -ReuseEditorRuntime -BatchOutputDirectory out/target-batches/Modern
      - name: Verify Modern binaries
        shell: pwsh
        run: ./tools/build/verify-release.ps1 -Configuration Release -CompatibilityTarget Modern -PlatformToolset v143 -SkipUpdateManifest -BatchOutputDirectory out/target-batches/Modern
      - name: Build Win32 property handler
        shell: pwsh
        run: ./tools/build/build-experimental-property-handler.ps1 -Configuration Release -Platform Win32 -PlatformToolset v143
      - name: Build x64 property handler
        shell: pwsh
        run: ./tools/build/build-experimental-property-handler.ps1 -Configuration Release -Platform x64 -PlatformToolset v143
      - name: Build FBV Verb MUI
        shell: pwsh
        run: ./tools/build/build-fbv-verb-mui.ps1 -Configuration Release
      - name: Build Win7-compatible editor runtime
        shell: pwsh
        run: ./tools/build/build.ps1 -Configuration Release -Platform Win32 -CompatibilityTarget Win7 -PlatformToolset v143 -EditorRuntimeOnly -ReuseEditorRuntime
      - name: Build Win7-compatible batch converters
        shell: pwsh
        run: ./tools/build/build.ps1 -Configuration Release -Platform Win32 -CompatibilityTarget Win7 -PlatformToolset v143 -BatchConvertersOnly -SkipDependencies -WarningsAsErrors -BatchOutputDirectory out/target-batches/Win7
      - name: Verify Win7 binaries
        shell: pwsh
        run: ./tools/build/verify-release.ps1 -Configuration Release -CompatibilityTarget Win7 -PlatformToolset v143 -SkipUpdateManifest -SkipCommonChecks -BatchOutputDirectory out/target-batches/Win7
      - name: Upload compiled inputs
        uses: actions/upload-artifact@v4
        with:
          name: FictionBookEditorNext-${{ github.sha }}-compiled
          path: |
            out/Release
            out/editor-runtime
            out/package/shell-build
            out/target-batches
          if-no-files-found: error
          retention-days: 14

  package:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Download compiled inputs
        uses: actions/download-artifact@v4
        with:
          name: FictionBookEditorNext-${{ github.sha }}-compiled
          path: out
      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis --no-progress --yes
          }
      - name: Restore runtime dictionaries for release verification
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path out/Release/dict -Force | Out-Null
          Copy-Item runtime/dict/* -Destination out/Release/dict -Force
      - name: Create Modern release artifacts without compiling
        shell: pwsh
        run: |
          $arguments = @{ Configuration = "Release"; Platform = "Win32"; CompatibilityTarget = "Modern"; PlatformToolset = "v143"; SkipBuild = $true; SkipPropertyHandlerBuild = $true; SkipFbvVerbMuiBuild = $true; SkipArtifactVerification = $true; BatchOutputDirectory = "out/target-batches/Modern" }
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $arguments.ReleaseTag = $env:GITHUB_REF_NAME
            if ($env:GITHUB_REF_NAME -match '^v\d+\.\d+\.\d+-') { $arguments.Prerelease = $true } else { $arguments.ValidateUpdateManifest = $true }
          }
          ./tools/build/create-release.ps1 @arguments
      - name: Create Win7 release artifacts without compiling
        shell: pwsh
        run: |
          ./tools/build/create-release.ps1 -Configuration Release -Platform Win32 -CompatibilityTarget Win7 -PlatformToolset v143 -SkipBuild -PreserveArtifacts -SkipPropertyHandlerBuild -SkipFbvVerbMuiBuild -SkipCommonChecks -SkipArtifactVerification -BatchOutputDirectory out/target-batches/Win7
      - name: Verify all release archives
        shell: pwsh
        run: ./tools/build/verify-artifacts.ps1 -Platform Win32 -CompatibilityTarget All
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FictionBookEditorNext-${{ github.sha }}-release
          path: |
            out/artifacts
            update.xml
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: FictionBookEditorNext-${{ github.sha }}-release
          path: .
      - name: Prepare human-readable release notes
        shell: pwsh
        run: ./tools/build/new-release-notes.ps1 -Version "${{ github.ref_name }}" -OutputPath out/RELEASE_NOTES.md
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem out/artifacts -Recurse -File | Select-Object -ExpandProperty FullName)
          $arguments = @("release", "create", "${{ github.ref_name }}") + $assets + @("--verify-tag", "--notes-file", "out/RELEASE_NOTES.md")
          if ("${{ github.ref_name }}" -match '^v\d+\.\d+\.\d+-') { $arguments += "--prerelease" }
          gh @arguments
      - name: Synchronize update manifest
        if: "!contains(github.ref_name, '-')"
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifestContent = [IO.File]::ReadAllText("update.xml", [Text.UTF8Encoding]::new($false))
          $encodedContent = [Convert]::ToBase64String([Text.UTF8Encoding]::new($false).GetBytes($manifestContent))
          $remoteFile = gh api "repos/${{ github.repository }}/contents/update.xml?ref=master" | ConvertFrom-Json
          if ($remoteFile.content) {
            $remoteContent = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($remoteFile.content -replace "\s", "")))
            if ($remoteContent -eq $manifestContent) { exit 0 }
          }
          gh api --method PUT "repos/${{ github.repository }}/contents/update.xml" -f "message=Синхронизировать манифест обновления ${{ github.ref_name }}" -f "content=$encodedContent" -f "sha=$($remoteFile.sha)" -f "branch=master"
