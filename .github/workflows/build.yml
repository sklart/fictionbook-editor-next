name: Build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  affected-script-regressions:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      FBE_CI_ISOLATED_PROFILE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: a48e891138f9df4417c9b92a5019ee2b33e87fad
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact source and submodules
        shell: pwsh
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Disposable runner required.' }
          if ((git rev-parse HEAD) -cne 'a48e891138f9df4417c9b92a5019ee2b33e87fad' -or $LASTEXITCODE -ne 0) { throw 'Unexpected candidate.' }
          if (@(git status --porcelain=v1).Count -or $LASTEXITCODE -ne 0) { throw 'Candidate is not clean.' }
          $modules = @(git submodule status --recursive)
          if ($LASTEXITCODE -ne 0 -or -not $modules.Count -or @($modules | Where-Object { $_ -match '^[-+U]' }).Count) { throw 'Submodule mismatch.' }
          $dirty = @(git submodule foreach --quiet --recursive 'git status --porcelain=v1')
          if ($LASTEXITCODE -ne 0 -or $dirty.Count) { throw 'Submodule is not clean.' }
      - name: Strict Release build
        shell: pwsh
        run: |
          $test = 'src/fbe/testing/RuntimeTestScriptingStage3C.inl'
          $text = [IO.File]::ReadAllText((Resolve-Path $test))
          $anchor = '            if(!xmlSame||!liveSame||!binarySame||!savepointsSame||beforeDirty!=afterDirty||!undoSame||!redoSame)'
          if (-not $text.Contains($anchor)) { throw 'Stage3C diagnostic anchor missing.' }
          $diagnostic = @'
            if (!savepointsSame) {
                CStringA d;
                d.Format("checkpoint saved=%ld,%ld recovery=%ld,%ld savedHtml=%d recoveryHtml=%d hasSaved=%d,%d hasRecovery=%d,%d reconcile=%d,%d clean=%d,%d recoveryClean=%d,%d\r\n", beforeSavepoints.savedVersion, afterSavepoints.savedVersion, beforeSavepoints.recoveryVersion, afterSavepoints.recoveryVersion, beforeSavepoints.savedHtml == afterSavepoints.savedHtml, beforeSavepoints.recoveryHtml == afterSavepoints.recoveryHtml, beforeSavepoints.hasSaved, afterSavepoints.hasSaved, beforeSavepoints.hasRecovery, afterSavepoints.hasRecovery, beforeSavepoints.reconcile, afterSavepoints.reconcile, beforeSavepoints.clean, afterSavepoints.clean, beforeSavepoints.recoveryClean, afterSavepoints.recoveryClean);
                DWORD n=0; output.Write(d,d.GetLength(),&n); output.Flush();
            }
          '@
          $text = $text.Replace($anchor, $diagnostic + "`r`n" + $anchor)
          $marker = '            const auto beforeSavepoints=m_doc->CaptureUndoSavepoints();'
          if (-not $text.Contains($marker)) { throw 'Stage3C before marker missing.' }
          $text = $text.Replace($marker, $marker + "`r`n" + '            CStringA mark; mark.Format("dialog-%d-begin",index); StartupTrace::AppendTestStartupBreadcrumb(mark);')
          $marker = '            const auto afterSavepoints=m_doc->CaptureUndoSavepoints();'
          if (-not $text.Contains($marker)) { throw 'Stage3C after marker missing.' }
          $text = $text.Replace($marker, '            mark.Format("dialog-%d-end",index); StartupTrace::AppendTestStartupBreadcrumb(mark);' + "`r`n" + $marker)
          [IO.File]::WriteAllText((Resolve-Path $test), $text, [Text.UTF8Encoding]::new($false))
          $cpp = (Resolve-Path 'src/fbe/FBDoc.cpp').Path
          $text = [IO.File]::ReadAllText($cpp)
          foreach ($item in @(
            @('void Doc::MarkSavePoint() {', 'void Doc::MarkSavePoint() { StartupTrace::AppendTestStartupBreadcrumb("MarkSavePoint");'),
            @('void Doc::ApplyThemeAppearance()', 'void Doc::ApplyThemeAppearance()'),
            @('if(cleanBefore) m_body_ver = versionAfter;', 'if(cleanBefore) { StartupTrace::AppendTestStartupBreadcrumb("ApplyThemeAppearance-save-version"); m_body_ver = versionAfter; }'),
            @('if (adjustSave) m_body_ver = versionAfter;', 'if (adjustSave) { StartupTrace::AppendTestStartupBreadcrumb("ProtectedSwap-save-version"); m_body_ver = versionAfter; }')
          )) {
            if (-not $text.Contains($item[0])) { throw "Missing checkpoint trace anchor: $($item[0])" }
            $text = $text.Replace($item[0], $item[1])
          }
          [IO.File]::WriteAllText($cpp, $text, [Text.UTF8Encoding]::new($false))
          $header = (Resolve-Path 'src/fbe/FBDoc.h').Path
          $text = [IO.File]::ReadAllText($header)
          $text = $text.Replace('#include "FBEView.h"', '#include "FBEView.h"' + "`r`n" + '#include "StartupTrace.h"')
          foreach ($item in @(
            @('void' + "`t" + '  AdvanceDocVersion (int delta) {', 'void' + "`t" + '  AdvanceDocVersion (int delta) { StartupTrace::AppendTestStartupBreadcrumb("AdvanceDocVersion");'),
            @('void AdvanceDocVersionIfUnchanged(long before, long after) {', 'void AdvanceDocVersionIfUnchanged(long before, long after) { StartupTrace::AppendTestStartupBreadcrumb("AdvanceDocVersionIfUnchanged");'),
            @('void RestoreUndoSavepoints(const UndoSavepoints& state) {', 'void RestoreUndoSavepoints(const UndoSavepoints& state) { StartupTrace::AppendTestStartupBreadcrumb("RestoreUndoSavepoints");'),
            @('void' + "`t" + '  ResetSavePoint() {', 'void' + "`t" + '  ResetSavePoint() { StartupTrace::AppendTestStartupBreadcrumb("ResetSavePoint");')
          )) {
            if (-not $text.Contains($item[0])) { throw "Missing checkpoint header anchor: $($item[0])" }
            $text = $text.Replace($item[0], $item[1])
          }
          [IO.File]::WriteAllText($header, $text, [Text.UTF8Encoding]::new($false))
          ./tools/build/Initialize-CiUtf8.ps1
          ./tools/build/build.ps1 -Configuration Release -Platform Win32 -PlatformToolset v143 -SkipUpx -WarningsAsErrors -StrictFirstPartyWarnings -SkipVersionSync -BatchOutputDirectory out/target-batches
          if (-not $? -or $LASTEXITCODE -ne 0) { throw 'Build failed.' }
      - name: Reconcile verified MIDL output
        shell: pwsh
        run: |
          git restore -- src/fbe/testing/RuntimeTestScriptingStage3C.inl src/fbe/FBDoc.cpp src/fbe/FBDoc.h
          if ($LASTEXITCODE -ne 0) { throw 'Cannot restore diagnostic-only test instrumentation.' }
          ./tools/rc3-acceptance/ReconcileMidl.ps1 -RepositoryRoot . -EvidenceDirectory out/tests/rc3-noop-fix -ExpectedSource 'a48e891138f9df4417c9b92a5019ee2b33e87fad'
      - name: Script live-reload contract
        if: ${{ false }}
        id: contract
        continue-on-error: true
        shell: pwsh
        run: ./tools/tests/test-fbe-script-live-reload-contract.ps1
      - name: No-op, real edits and reentrant callbacks
        if: ${{ false }}
        id: edits
        continue-on-error: true
        shell: pwsh
        run: |
          $driver = (Resolve-Path 'tools/rc3-acceptance/test-noop-real-edits.ps1').Path
          $text = [IO.File]::ReadAllText($driver)
          if (-not $text.Contains('foreach ($case in $cases)')) { throw 'Driver loop anchor missing.' }
          $text = $text.Replace('$case', '$scenario')
          [IO.File]::WriteAllText($driver, $text, [Text.UTF8Encoding]::new($false))
          ./tools/rc3-acceptance/test-noop-real-edits.ps1 -FbeExe out/Release/FBE.exe
      - name: Original Stage3C dialogs
        id: stage3c
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/tests/rc3-noop-fix | Out-Null
          $env:FBE_NEXT_TEST_STARTUP_BREADCRUMB = (Join-Path (Resolve-Path out/tests/rc3-noop-fix) 'checkpoints.txt')
          ./tools/tests/test-fbe-scripting-stage3c.ps1 -FbeExe out/Release/FBE.exe -Part dialogs -Mode portable -EvidenceDirectory out/tests/rc3-noop-fix/stage3c
      - name: New document after no-op
        if: ${{ false }}
        id: newdoc
        continue-on-error: true
        shell: pwsh
        run: ./tools/tests/test-fbe-new-document-edit-state-runtime.ps1 -FbeExe out/Release/FBE.exe
      - name: Script reload and legacy path
        if: ${{ false }}
        id: reload
        continue-on-error: true
        shell: pwsh
        run: |
          ./tools/tests/test-fbe-script-live-reload-runtime.ps1 -FbeExe out/Release/FBE.exe
          ./tools/tests/test-fbe-script-usercmd-path.ps1 -FbeExe out/Release/FBE.exe
          ./tools/tests/test-fbe-script-usercmd-path.ps1 -FbeExe out/Release/FBE.exe -Encoding utf16be
      - name: Reentrant save and recovery
        id: recovery
        if: steps.edits.outcome == 'success' && steps.stage3c.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          ./tools/tests/test-fbe-script-form-dirty-runtime.ps1 -FbeExe out/Release/FBE.exe -SaveFirst
          ./tools/tests/test-fbe-reentrant-close-runtime.ps1 -FbeExe out/Release/FBE.exe
          ./tools/tests/test-fbe-recovery-history-runtime.ps1 -FbeExe out/Release/FBE.exe -Case binary -Restart
          ./tools/tests/test-fbe-recovery-history-runtime.ps1 -FbeExe out/Release/FBE.exe -Case description -Restart
      - name: Save and reopen FB2, FBD and ZIP
        id: formats
        if: steps.edits.outcome == 'success' && steps.stage3c.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          ./tools/tests/test-fbe-file-close-runtime.ps1 -FbeExe out/Release/FBE.exe -Kind fb2 -Container normal
          ./tools/tests/test-fbe-file-close-runtime.ps1 -FbeExe out/Release/FBE.exe -Kind fbd -Container normal
          ./tools/tests/test-fbe-file-close-runtime.ps1 -FbeExe out/Release/FBE.exe -Kind fb2 -Container zip
      - name: Require targeted checks
        if: always()
        shell: pwsh
        run: |
          $results = @('${{ steps.stage3c.outcome }}')
          New-Item -ItemType Directory -Force out/tests/rc3-noop-fix | Out-Null
          $results | Set-Content out/tests/rc3-noop-fix/step-outcomes.txt
          if (@($results | Where-Object { $_ -ne 'success' }).Count) { throw 'Affected regression checks incomplete or failed.' }
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rc3-noop-fix-targeted
          path: |
            out/tests/rc3-noop-fix/**
            out/tests/rc3-noop-real-edits/**
            out/tests/runtime-failure/**
          if-no-files-found: warn
          retention-days: 14
