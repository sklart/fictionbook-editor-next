name: Build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mshtml-dirty-range-probe:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compile and run isolated MSHTML probe
        shell: pwsh
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Disposable runner required.' }
          . ./tools/build/Import-VsDevEnvironment.ps1 -Arch x86 -HostArch x64 -PlatformToolset v143 -VcVarsVersion 14.44
          New-Item -ItemType Directory -Force out/probe | Out-Null
          cl.exe /nologo /EHsc /W4 /WX /std:c++17 tools/rc3-acceptance/probe-mshtml-dirty-range.cpp /Fe:out/probe/probe.exe /Fo:out/probe/probe.obj ole32.lib oleaut32.lib uuid.lib
          if ($LASTEXITCODE -ne 0) { throw 'Probe compilation failed.' }
          & ./out/probe/probe.exe 2>&1 | Tee-Object out/probe/result.txt
          if ($LASTEXITCODE -ne 0) { throw 'Probe failed; see result.' }
      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mshtml-dirty-range-probe
          path: out/probe/**
          if-no-files-found: warn
          retention-days: 14
