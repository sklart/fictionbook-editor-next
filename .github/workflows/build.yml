name: Build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage3c-observation:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 8c9e8878a9b564c1dd91ad5f08ff434ef0221430
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false
      - name: Verify candidate
        shell: pwsh
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Disposable runner required.' }
          if ((git rev-parse HEAD) -cne '8c9e8878a9b564c1dd91ad5f08ff434ef0221430' -or $LASTEXITCODE -ne 0) { throw 'Unexpected candidate.' }
          if (@(git status --porcelain=v1).Count -or $LASTEXITCODE -ne 0) { throw 'Candidate is not clean.' }
          $modules = @(git submodule status --recursive)
          if ($LASTEXITCODE -ne 0 -or -not $modules.Count -or @($modules | Where-Object { $_ -match '^[-+U]' }).Count) { throw 'Submodule mismatch.' }
          $dirty = @(git submodule foreach --quiet --recursive 'git status --porcelain=v1')
          if ($LASTEXITCODE -ne 0 -or $dirty.Count) { throw 'Submodule is not clean.' }
      - name: Test diagnostic parser
        shell: pwsh
        run: ./tools/rc3-acceptance/test-stage3c-isolation-mocked.ps1
      - name: Build Release with strict warnings
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          ./tools/build/build.ps1 -Configuration Release -Platform Win32 -PlatformToolset v143 -SkipUpx -WarningsAsErrors -StrictFirstPartyWarnings -SkipVersionSync -BatchOutputDirectory out/target-batches
          if (-not $? -or $LASTEXITCODE -ne 0) { throw 'Build failed.' }
      - name: Reconcile verified MIDL output
        shell: pwsh
        run: ./tools/rc3-acceptance/ReconcileMidl.ps1 -RepositoryRoot . -EvidenceDirectory out/tests/rc3-stage3c-observation -ExpectedSource '8c9e8878a9b564c1dd91ad5f08ff434ef0221430'
      - name: Observe dialogs and no-op with two history states
        shell: pwsh
        env:
          FBE_CI_ISOLATED_PROFILE: '1'
        run: ./tools/rc3-acceptance/test-stage3c-isolation.ps1 -FbeExe out/Release/FBE.exe
      - name: Upload observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage3c-observation
          path: |
            out/tests/rc3-stage3c-observation/**
            out/tests/rc3-stage3c-isolation/**
            out/tests/runtime-failure/**
          if-no-files-found: warn
          retention-days: 14
