name: Build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  correction-targeted:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      FBE_CI_ISOLATED_PROFILE: '1'
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          ref: a48e891138f9df4417c9b92a5019ee2b33e87fad
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false
      - name: Verify base and pinned submodules
        shell: pwsh
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Disposable runner required.' }
          if ((git rev-parse HEAD) -cne 'a48e891138f9df4417c9b92a5019ee2b33e87fad' -or $LASTEXITCODE -ne 0) { throw 'Unexpected base.' }
          if (@(git status --porcelain=v1).Count -or $LASTEXITCODE -ne 0) { throw 'Base is not clean.' }
          $modules = @(git submodule status --recursive)
          if ($LASTEXITCODE -ne 0 -or -not $modules.Count -or @($modules | Where-Object { $_ -match '^[-+U]' }).Count) { throw 'Submodule mismatch.' }
          $dirty = @(git submodule foreach --quiet --recursive 'git status --porcelain=v1')
          if ($LASTEXITCODE -ne 0 -or $dirty.Count) { throw 'Dirty submodule.' }
      - name: Checkout diagnostic harness
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: ci-harness
          persist-credentials: false
      - name: Apply exact correction
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $checkoutPatch = 'ci-harness/tools/rc3-acceptance/rc3-noop-correction-candidate.patch'
          $expected = '6EA93DE61950467A37655BF4BB04B52F0C39958FC0094C09D0C7336BD200F600'
          $utf8 = [Text.UTF8Encoding]::new($false, $true)
          $content = $utf8.GetString([IO.File]::ReadAllBytes((Resolve-Path $checkoutPatch)))
          $normalized = $content.Replace("`r`n", "`n")
          if ($normalized.Contains("`r")) { throw 'Unexpected carriage return in patch.' }
          $canonical = $utf8.GetBytes($normalized)
          if ([Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($canonical)) -cne $expected) { throw 'Canonical patch hash mismatch.' }
          New-Item -ItemType Directory -Force out/tests/rc3-correction | Out-Null
          $patch = 'out/tests/rc3-correction/applied.patch'
          [IO.File]::WriteAllBytes((Join-Path (Get-Location) $patch), $canonical)
          git apply --check $patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch check failed.' }
          git apply $patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch application failed.' }
          Copy-Item tools/rc3-acceptance/test-noop-real-edits.ps1 out/tests/rc3-correction/corrected-driver.ps1
          git diff --binary -- src/fbe/FBDoc.cpp tools/rc3-acceptance/test-noop-real-edits.ps1 | Set-Content out/tests/rc3-correction/applied.diff -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Cannot save applied diff.' }
          "base=a48e891138f9df4417c9b92a5019ee2b33e87fad`npatch-sha256=$expected`nharness=$env:GITHUB_SHA" | Set-Content out/tests/rc3-correction/identity.txt
      - name: Strict Release build
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          ./tools/build/build.ps1 -Configuration Release -Platform Win32 -PlatformToolset v143 -SkipUpx -WarningsAsErrors -StrictFirstPartyWarnings -SkipVersionSync -BatchOutputDirectory out/target-batches
          if (-not $? -or $LASTEXITCODE -ne 0) { throw 'Build failed.' }
          Get-FileHash out/Release/FBE.exe -Algorithm SHA256 | Format-List | Out-File out/tests/rc3-correction/executable-sha256.txt
      - name: Restore test source for MIDL reconciliation
        shell: pwsh
        run: |
          git restore -- src/fbe/FBDoc.cpp tools/rc3-acceptance/test-noop-real-edits.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Cannot restore temporary patch.' }
          ./tools/rc3-acceptance/ReconcileMidl.ps1 -RepositoryRoot . -EvidenceDirectory out/tests/rc3-correction -ExpectedSource 'a48e891138f9df4417c9b92a5019ee2b33e87fad'
          Copy-Item out/tests/rc3-correction/corrected-driver.ps1 tools/rc3-acceptance/test-noop-real-edits.ps1 -Force
      - name: No-op, edits and reentrant callbacks
        id: edits
        continue-on-error: true
        shell: pwsh
        run: ./tools/rc3-acceptance/test-noop-real-edits.ps1 -FbeExe out/Release/FBE.exe
      - name: Original Stage3C dialogs
        id: stage3c
        if: steps.edits.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: ./tools/tests/test-fbe-scripting-stage3c.ps1 -FbeExe out/Release/FBE.exe -Part dialogs -Mode portable -EvidenceDirectory out/tests/rc3-correction/stage3c
      - name: New document
        id: newdoc
        if: steps.edits.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: ./tools/tests/test-fbe-new-document-edit-state-runtime.ps1 -FbeExe out/Release/FBE.exe
      - name: Reentrant save and recovery
        id: recovery
        if: steps.edits.outcome == 'success' && steps.stage3c.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          ./tools/tests/test-fbe-script-form-dirty-runtime.ps1 -FbeExe out/Release/FBE.exe -SaveFirst
          ./tools/tests/test-fbe-reentrant-close-runtime.ps1 -FbeExe out/Release/FBE.exe
          ./tools/tests/test-fbe-recovery-history-runtime.ps1 -FbeExe out/Release/FBE.exe -Case binary-second -Restart
          ./tools/tests/test-fbe-recovery-history-runtime.ps1 -FbeExe out/Release/FBE.exe -Case description
      - name: Save and reopen FB2, FBD and ZIP
        id: formats
        if: steps.edits.outcome == 'success' && steps.stage3c.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          ./tools/tests/test-fbe-file-close-runtime.ps1 -FbeExe out/Release/FBE.exe -Kind fb2 -Container normal
          ./tools/tests/test-fbe-file-close-runtime.ps1 -FbeExe out/Release/FBE.exe -Kind fbd -Container normal
          ./tools/tests/test-fbe-file-close-runtime.ps1 -FbeExe out/Release/FBE.exe -Kind fb2 -Container zip
      - name: Require targeted checks
        if: always()
        shell: pwsh
        run: |
          $results = @('${{ steps.edits.outcome }}','${{ steps.stage3c.outcome }}','${{ steps.newdoc.outcome }}','${{ steps.recovery.outcome }}','${{ steps.formats.outcome }}')
          New-Item -ItemType Directory -Force out/tests/rc3-correction | Out-Null
          $results | Set-Content out/tests/rc3-correction/step-outcomes.txt
          if (@($results | Where-Object { $_ -ne 'success' }).Count) { throw 'Affected checks incomplete or failed.' }
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rc3-correction-targeted
          path: |
            out/tests/rc3-correction/**
            out/tests/rc3-noop-real-edits/**
            out/tests/runtime-failure/**
          if-no-files-found: warn
          retention-days: 14
