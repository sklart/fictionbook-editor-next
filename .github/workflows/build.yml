name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  validate:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Check generated version files and pipeline structure
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          ./tools/version/sync-version.ps1
          git diff --exit-code -- packaging/nsis/Installer/version.nsh
          ./tools/tests/test-release-pipeline-deduplication.ps1
          ./tools/tests/test-update-release-pipeline.ps1
          ./tools/tests/test-update-manifest.ps1
          ./tools/tests/test-legacy308-migration-policy.ps1
          ./tools/tests/test-legacy308-artifact-migration.ps1
          ./tools/tests/test-create-release-alias-names.ps1
          ./tools/tests/test-update-version.ps1
          ./tools/tests/test-buildstamp-fallback.ps1
          ./tools/tests/test-fbe-script-command-ids.ps1
          ./tools/tests/test-portable-scripts-infrastructure.ps1
          ./tools/tests/test-fbe-script-folder-icons.ps1
          ./tools/tests/test-fbe-settings-tooltips.ps1
          ./tools/tests/test-ci-build-contract.ps1
          ./tools/tests/test-modern-file-dialog-contract.ps1
          ./tools/tests/test-export-html-options-dialog.ps1
          ./tools/tests/test-export-docx-modern-file-dialog.ps1
          ./tools/tests/test-export-epub-modern-file-dialog.ps1
          ./tools/build/verify-nsis-layout.ps1
      - name: Test VsDevCmd with a long PATH
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          ./tools/tests/test-vsdev-environment-long-path.ps1

  build:
    needs: validate
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Restore PCRE2 cache
        uses: actions/cache@v4
        id: pcre2-cache
        with:
          path: build/pcre2
          key: ${{ runner.os }}-pcre2-release-win32-v143-vs2022-${{ hashFiles('third_party/pcre2/**', 'tools/build/build-pcre2.ps1') }}
      - name: Restore Hunspell cache
        uses: actions/cache@v4
        with:
          path: build/hunspell
          key: ${{ runner.os }}-hunspell-release-win32-v143-mt-${{ hashFiles('third_party/hunspell/**', 'tools/build/build-hunspell.ps1') }}
      - name: Restore image decoder stack cache
        uses: actions/cache@v4
        with:
          path: |
            build/aom
            build/libde265
            build/libheif
          key: ${{ runner.os }}-image-decoders-release-win32-v143-${{ hashFiles('third_party/aom/**', 'third_party/libde265/**', 'third_party/libheif/**', 'tools/build/Resolve-VsCmake.ps1', 'tools/build/build-aom.ps1', 'tools/build/build-libde265.ps1', 'tools/build/build-libheif.ps1') }}
      - name: Restore universal editor runtime cache
        uses: actions/cache@v4
        with:
          path: out/editor-runtime
          key: ${{ runner.os }}-editor-runtime-win32-v143-vc144-${{ hashFiles('third_party/scintilla/**', 'third_party/lexilla/**', 'tools/build/build-scintilla.ps1', 'tools/build/editor-runtime-helpers.ps1') }}
      - name: Build Release Win32
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          $arguments = @{ Configuration = 'Release'; Platform = 'Win32'; PlatformToolset = 'v143'; SkipUpx = $true; WarningsAsErrors = $true; ReuseEditorRuntime = $true; SkipVersionSync = $true; BatchOutputDirectory = 'out/target-batches' }
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $arguments.ReleaseVersion = $env:GITHUB_REF_NAME.Substring(1) }
          if ('${{ steps.pcre2-cache.outputs.cache-hit }}' -eq 'true') { $arguments.ReusePreparedPcre2 = $true }
          ./tools/build/build.ps1 @arguments
      - name: Run keyboard layout C++ regression
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          $vsDevCmd = "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat"
          cmd.exe /d /s /c "`"$vsDevCmd`" -arch=x86 -host_arch=x64 -vcvars_ver=14.44 >nul && pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\tests\test-fbe-keyboard-layout-selection-cpp.ps1"
      - name: Run filesystem backup regression
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          ./tools/tests/test-fbe-backup-file-commit.ps1
      - name: Build Win32 shell integration
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          ./tools/build/build-shell-integration.ps1 -Configuration Release -Platform Win32 -PlatformToolset v143
      - name: Build x64 shell integration
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          ./tools/build/build-shell-integration.ps1 -Configuration Release -Platform x64 -PlatformToolset v143
      - name: Verify shell integration build outputs
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          ./tools/tests/test-ci-build-contract.ps1 -RequireArtifacts
      - name: Build FBV Verb MUI
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          ./tools/build/build-fbv-verb-mui.ps1 -Configuration Release -PlatformToolset v143
      - name: Build ArchHandler
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          ./tools/build/build-archhandler.ps1 -PlatformToolset v143 -OutputDirectory out/archhandler/Win32/Release
      - name: Write Runtime build provenance
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          ./tools/build/build-provenance.ps1 -Action Write -Kind Runtime -Configuration Release -ProfileDirectory out/editor-runtime -BatchDirectory out/target-batches -ArchHandlerDirectory out/archhandler/Win32/Release -PlatformToolset v143
      - name: Ensure NSIS 3.12
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          choco upgrade nsis --version=3.12.0 --no-progress --yes
          ./tools/build/resolve-nsis.ps1 | Out-Null
      - name: Verify universal release binaries
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          $arguments = @{ Configuration = 'Release'; PlatformToolset = 'v143'; SkipUpdateManifest = $true; BatchOutputDirectory = 'out/target-batches'; ArchHandlerOutputDirectory = 'out/archhandler/Win32/Release' }
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $arguments.FullValidation = $true }
          ./tools/build/verify-release.ps1 @arguments
      - name: Smoke bundled plugin upgrade and uninstall
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          $testRoot = 'out/tests/bundled-plugin-installer-smoke'
          $repoRoot = (Get-Location).Path
          ./tools/build/stage-core.ps1 -Configuration Release -OutputDirectory "$testRoot/Core" -EditorRuntimeDirectory out/editor-runtime -BatchOutputDirectory out/target-batches -ArchHandlerOutputDirectory out/archhandler/Win32/Release
          ./tools/build/stage-integration.ps1 -Configuration Release -OutputDirectory "$testRoot/Integration"
          ./tools/build/prepare-installer.ps1 -CoreDirectory "$testRoot/Core" -IntegrationDirectory "$testRoot/Integration" -OutputDirectory "$testRoot/Input"
          $makensis = ./tools/build/resolve-nsis.ps1
          $installerDirectory = Join-Path $PWD 'packaging/nsis/Installer'
          $setup = Join-Path $PWD "$testRoot/setup.exe"
          $input = Join-Path $repoRoot "$testRoot/Input"
          Push-Location $installerDirectory
          try {
            & $makensis '/X!addincludedir ..\NSIS' '/X!addplugindir /x86-unicode ..\NSIS' ('/DINPUTDIR=' + $input) ('/DOUTPUTFILE=' + $setup) 'MakeInstaller.nsi'
            if ($LASTEXITCODE -ne 0) { throw "makensis failed for bundled plugin upgrade smoke: $LASTEXITCODE" }
          }
          finally { Pop-Location }
          ./tools/tests/test-bundled-plugin-upgrade-uninstall.ps1 -InstallerPath $setup -PluginSourceDirectory "$testRoot/Input/Plugins" -TestDirectory "$testRoot/run"
      - name: Upload compiled inputs
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: FictionBookEditorNext-${{ github.sha }}-compiled
          path: |
            out/Release
            out/editor-runtime
            out/archhandler
            out/package/shell-build
            out/target-batches
            out/build-provenance
          if-no-files-found: error
          retention-days: 3

  package:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Download compiled inputs
        uses: actions/download-artifact@v4
        with:
          name: FictionBookEditorNext-${{ github.sha }}-compiled
          path: out
      - name: Ensure NSIS 3.12
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          choco upgrade nsis --version=3.12.0 --no-progress --yes
          ./tools/build/resolve-nsis.ps1 | Out-Null
      - name: Create release artifacts without compiling
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          $arguments = @{ Configuration = "Release"; Platform = "Win32"; PlatformToolset = "v143"; SkipBuild = $true; SkipPropertyHandlerBuild = $true; SkipFbvVerbMuiBuild = $true; SkipReleaseVerification = $true; SkipArtifactVerification = $true; SkipVersionSync = $true; BatchOutputDirectory = "out/target-batches" }
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $arguments.ReleaseTag = $env:GITHUB_REF_NAME
            $arguments.FullValidation = $true
            if ($env:GITHUB_REF_NAME -match '^v\d+\.\d+\.\d+-') { $arguments.Prerelease = $true }
          }
          ./tools/build/create-release.ps1 @arguments
      - name: Verify release archives
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          $arguments = @{ Platform = 'Win32' }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $arguments.ReleaseTag = $env:GITHUB_REF_NAME
            . ./tools/build/UpdateVersion.ps1
            if (Test-FbeLegacy308MigrationRequired $env:GITHUB_REF_NAME.Substring(1)) {
              $arguments.AllowLegacyWin7Aliases = $true
            }
          }
          ./tools/build/verify-artifacts.ps1 @arguments
      - name: Create update manifest candidate
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          ./tools/build/new-update-manifest-candidate.ps1 -ArtifactsRoot out/artifacts -OutputPath out/release/update.xml -ReleaseTag "${{ github.ref_name }}"
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FictionBookEditorNext-${{ github.sha }}-release
          path: |
            out/artifacts
            out/release/update.xml
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: FictionBookEditorNext-${{ github.sha }}-release
          # The uploaded paths have `out` as their common ancestor. Restore
          # into it so later steps consistently use out/artifacts and
          # out/release/update.xml.
          path: out
      - name: Prepare human-readable release notes
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          ./tools/build/new-release-notes.ps1 -Version "${{ github.ref_name }}" -OutputPath out/RELEASE_NOTES.md
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          $releaseTag = "${{ github.ref_name }}"
          $assets = @(Get-ChildItem out/artifacts -Recurse -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" })
          if ($assets.Count -eq 0) { throw "Не найдены файлы для публикации release." }

          $checksumsPath = Join-Path $env:RUNNER_TEMP "SHA256SUMS.txt"
          $checksumLines = foreach ($asset in $assets) {
            $hash = Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256
            "{0} *{1}" -f $hash.Hash.ToLowerInvariant(), $asset.Name
          }
          [IO.File]::WriteAllLines($checksumsPath, @($checksumLines), [Text.UTF8Encoding]::new($false))

          gh release view $releaseTag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            # Existing release body is the authoritative, possibly manually edited notes.
            if ($releaseTag -match '^v\d+\.\d+\.\d+-') {
              gh release edit $releaseTag --prerelease=true
            }
          } else {
            $arguments = @("release", "create", $releaseTag, "--verify-tag", "--notes-file", "out/RELEASE_NOTES.md")
            if ($releaseTag -match '^v\d+\.\d+\.\d+-') { $arguments += "--prerelease" }
            gh @arguments
          }

          $uploadAssets = @($assets.FullName) + $checksumsPath
          gh release upload $releaseTag @uploadAssets --clobber
      - name: Synchronize update manifests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          $manifestContent = [IO.File]::ReadAllText("out/release/update.xml", [Text.UTF8Encoding]::new($false))
          $encodedContent = [Convert]::ToBase64String([Text.UTF8Encoding]::new($false).GetBytes($manifestContent))
          $feeds = if ('${{ github.ref_name }}' -match '^v\d+\.\d+\.\d+-') { @('update-prerelease.xml') } else { @('update.xml', 'update-prerelease.xml') }
          foreach ($feed in $feeds) {
            $remoteFile = gh api "repos/${{ github.repository }}/contents/$feed`?ref=master" | ConvertFrom-Json
            if ($remoteFile.content) {
              $remoteContent = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($remoteFile.content -replace "\s", "")))
              if ($remoteContent -eq $manifestContent) { continue }
            }
            gh api --method PUT "repos/${{ github.repository }}/contents/$feed" -f "message=Синхронизировать манифест обновления ${{ github.ref_name }}" -f "content=$encodedContent" -f "sha=$($remoteFile.sha)" -f "branch=master"
          }
