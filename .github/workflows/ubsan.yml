name: UndefinedBehaviorSanitizer

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '47 2 * * 1'
  workflow_call:
    inputs:
      full_validation:
        type: boolean
        default: false
        required: false
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run the extended UBSan correctness contour
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ubsan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  ubsan:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Record and verify source before build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/tests/ubsan | Out-Null
          $status = @(git status --porcelain=v1 --untracked-files=no)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect source status before build.' }
          [IO.File]::WriteAllLines((Join-Path (Get-Location) 'out/tests/ubsan/source-before.log'), [string[]]$status)
          if ($status.Count) { throw 'Source is dirty before build.' }
      - name: Prepare native LLVM with i386 UBSan runtime
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          New-Item -ItemType Directory -Force out/tests/ubsan | Out-Null
          ./tools/build/prepare-ubsan-llvm.ps1 *> out/tests/ubsan/toolchain.log
      - name: Verify Clang probe before product integration
        shell: pwsh
        run: ./tools/tests/test-ubsan-infrastructure.ps1
      - name: Build isolated Release Win32 UndefinedBehaviorSanitizer
        shell: pwsh
        run: |
          $watch = [Diagnostics.Stopwatch]::StartNew()
          try {
            ./tools/build/build.ps1 -Configuration Release -Platform Win32 -Sanitizer Undefined *> out/tests/ubsan/build.log
            if (-not $? -or $LASTEXITCODE -ne 0) { throw 'UBSan build failed; see build.log' }
          } finally { $watch.Stop(); "UBSan build: $([math]::Round($watch.Elapsed.TotalSeconds, 1)) s." >> $env:GITHUB_STEP_SUMMARY }
      - name: Verify UBSan build and production rejection policy
        shell: pwsh
        run: ./tools/tests/test-ubsan-build-policy.ps1
      - name: Record and reconcile verified MIDL output
        shell: pwsh
        run: |
          git status --porcelain=v1 --untracked-files=no | Set-Content out/tests/ubsan/source-after.log
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect source status after build.' }
          git diff HEAD --binary --output=out/tests/ubsan/source-after.patch
          if ($LASTEXITCODE -ne 0) { throw 'Cannot record source diff.' }
          ./tools/rc3-acceptance/ReconcileMidl.ps1 -RepositoryRoot . -EvidenceDirectory out/tests/ubsan -ExpectedSource $env:GITHUB_SHA
          $remaining = @(git status --porcelain=v1 --untracked-files=no)
          if ($LASTEXITCODE -ne 0 -or $remaining.Count) { throw 'Tracked source or submodules remain dirty.' }
      - name: Run focused sanitizer checks
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type != 'tag') || ((github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && !inputs.full_validation)
        shell: pwsh
        run: ./tools/tests/invoke-sanitizer-ci.ps1 -Sanitizer Undefined -Focused
      - name: Run UBSan FULL
        if: github.ref_type == 'tag' || github.event_name == 'schedule' || ((github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.full_validation)
        shell: pwsh
        run: ./tools/tests/invoke-sanitizer-ci.ps1 -Sanitizer Undefined -AllowUserComRegistration
      - name: Ensure failures have a summary
        if: always()
        shell: pwsh
        env:
          UBSAN_JOB_STATUS: ${{ job.status }}
        run: |
          New-Item -ItemType Directory -Force out/tests/ubsan | Out-Null
          $summaries = @(Get-ChildItem out/tests/ubsan -Recurse -Filter summary.json)
          @{status=$env:UBSAN_JOB_STATUS; sanitizer='Undefined'; commit=$env:GITHUB_SHA; summaries=@($summaries.FullName)} |
            ConvertTo-Json | Set-Content out/tests/ubsan/ci-summary.json -Encoding utf8
          $env:SANITIZER_JOB_STATUS = $env:UBSAN_JOB_STATUS
          ./tools/tests/write-sanitizer-ci-summary.ps1 -Directory ubsan
      - name: Upload diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ubsan-diagnostics
          path: |
            out/tests/ubsan/**/*.log
            out/tests/ubsan/**/ubsan.*
            out/tests/ubsan/**/summary.json
            out/tests/ubsan/**/result.json
            out/tests/ubsan/**/case.json
            out/tests/ubsan/**/*.patch
            out/tests/ubsan/midl-reconciliation.json
            out/tests/ubsan/ci-summary.json
            out/ubsan/Release/fbe-sanitizer.json
            out/ubsan/Release/fbe-ubsan-toolchain.json
          if-no-files-found: error
          retention-days: 14
