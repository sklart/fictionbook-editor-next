name: RC3 isolated acceptance

on:
  push:
    branches: [codex/rc3-acceptance]

permissions:
  contents: read

jobs:
  candidate:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify candidate is accessible to Actions
        uses: actions/checkout@v7
        with:
          ref: c4bcb76c3cd03d1dff88fa557aa75261b4ec0461
          persist-credentials: false
      - name: Require the exact commit
        shell: bash
        run: |
          product_sha="$(git rev-parse HEAD)"
          test "$product_sha" = c4bcb76c3cd03d1dff88fa557aa75261b4ec0461
          printf 'Production SHA: `%s`\nWorkflow SHA: `%s`\n' "$product_sha" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  compare:
    needs: candidate
    if: github.ref_type == 'branch'
    runs-on: windows-2022
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        variant: [Address, Release]
    steps:
      - name: Require GitHub-hosted runner
        id: hosted
        shell: pwsh
        run: if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Self-hosted runners are forbidden.' }
      - name: Checkout acceptance harness
        uses: actions/checkout@v7
        with:
          path: harness
          persist-credentials: false
      - name: Checkout candidate and pinned submodules
        uses: actions/checkout@v7
        with:
          ref: c4bcb76c3cd03d1dff88fa557aa75261b4ec0461
          path: candidate
          submodules: recursive
          persist-credentials: false
      - name: Build candidate
        timeout-minutes: 180
        shell: pwsh
        working-directory: candidate
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out/rc3-evidence | Out-Null
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -ne 'c4bcb76c3cd03d1dff88fa557aa75261b4ec0461') { throw 'Unexpected checkout SHA.' }
          ./tools/build/Initialize-CiUtf8.ps1
          $arguments = @{ Configuration='Release'; Platform='Win32'; PlatformToolset='v143'; SkipVersionSync=$true }
          if ($env:VARIANT -eq 'Address') { $arguments.Sanitizer='Address' }
          try { ./tools/build/build.ps1 @arguments *> out/rc3-evidence/build.log; if (-not $? -or $LASTEXITCODE -ne 0) { throw 'Build failed.' } }
          finally { "candidate=$sha; variant=$env:VARIANT" | Set-Content out/rc3-evidence/build-identity.txt }
      - name: Record generated-source changes
        shell: pwsh
        working-directory: candidate
        run: |
          git -c diff.ignoreSubmodules=all diff --no-ext-diff HEAD -- src/export-docx/ExportDOCX_i.c src/export-docx/ExportDOCX_i.h src/export-epub/ExportEPUB_i.c src/export-epub/ExportEPUB_i.h *> out/rc3-evidence/midl-generated.patch
          if ($LASTEXITCODE -ne 0) { throw 'Cannot record MIDL source changes.' }
          git status --short --untracked-files=no *> out/rc3-evidence/source-status.log
          if ($LASTEXITCODE -ne 0) { throw 'Cannot record source status.' }
      - name: Record binary and symbol hashes
        shell: pwsh
        working-directory: candidate
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          $output = if ($env:VARIANT -eq 'Address') { 'out/asan/Release' } else { 'out/Release' }
          $files = @(
            Get-ChildItem -LiteralPath $output -File | Where-Object Extension -in @('.exe','.dll','.pdb')
            Get-ChildItem -LiteralPath (Join-Path $output 'Plugins') -File | Where-Object Extension -in @('.dll','.pdb')
          )
          if (-not @($files | Where-Object Name -eq 'FBE.exe').Count -or -not @($files | Where-Object Name -eq 'FBE.pdb').Count) { throw 'Executable or symbols missing.' }
          $files | Get-FileHash -Algorithm SHA256 | Select-Object Path,Hash | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath out/rc3-evidence/binary-hashes.json -Encoding utf8
      - name: Run one case with crash collector
        id: case
        continue-on-error: true
        timeout-minutes: 25
        shell: pwsh
        env:
          VARIANT: ${{ matrix.variant }}
          FBE_RUNTIME_FAILURE_ARTIFACTS: ${{ github.workspace }}\candidate\out\tests\runtime-failure
        run: |
          ./harness/tools/rc3-acceptance/run-with-collector.ps1 -Variant $env:VARIANT -RepositoryRoot ./candidate -EvidenceRoot ./candidate/out/rc3-evidence/diagnostic
      - name: Upload evidence even after failure
        if: always() && steps.hosted.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: rc3-compare-${{ matrix.variant }}
          path: |
            candidate/out/rc3-evidence/**
            candidate/out/tests/runtime-failure/**
            candidate/out/asan/Release/*.exe
            candidate/out/asan/Release/*.dll
            candidate/out/asan/Release/*.pdb
            candidate/out/asan/Release/Plugins/*.dll
            candidate/out/asan/Release/Plugins/*.pdb
            candidate/out/Release/*.exe
            candidate/out/Release/*.dll
            candidate/out/Release/*.pdb
            candidate/out/Release/Plugins/*.dll
            candidate/out/Release/Plugins/*.pdb
          if-no-files-found: error
          retention-days: 14
      - name: Report case failure
        if: always() && steps.hosted.outcome == 'success' && steps.case.outcome == 'failure'
        shell: pwsh
        run: throw 'Comparison case or collector failed; inspect the uploaded evidence.'

  ubsan:
    needs: compare
    if: always() && needs.compare.result != 'cancelled' && needs.compare.result != 'skipped'
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - name: Require GitHub-hosted runner
        id: hosted
        shell: pwsh
        run: if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Self-hosted runners are forbidden.' }
      - uses: actions/checkout@v7
        with:
          ref: c4bcb76c3cd03d1dff88fa557aa75261b4ec0461
          submodules: recursive
          persist-credentials: false
      - name: Prepare UBSan toolchain
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          New-Item -ItemType Directory -Force out/tests/ubsan | Out-Null
          ./tools/build/prepare-ubsan-llvm.ps1 *> out/tests/ubsan/toolchain.log
          ./tools/tests/test-ubsan-infrastructure.ps1
      - name: Build UBSan
        timeout-minutes: 150
        shell: pwsh
        run: |
          ./tools/build/build.ps1 -Configuration Release -Platform Win32 -Sanitizer Undefined *> out/tests/ubsan/build.log
          if (-not $? -or $LASTEXITCODE -ne 0) { throw 'UBSan build failed.' }
          ./tools/tests/test-ubsan-build-policy.ps1
      - name: Record UBSan source state
        if: always() && steps.hosted.outcome == 'success'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/tests/ubsan | Out-Null
          git -c diff.ignoreSubmodules=all diff --name-status --exit-code HEAD -- *> out/tests/ubsan/source-diff.log
          "diff_exit=$LASTEXITCODE" | Add-Content out/tests/ubsan/source-diff.log
          git -c diff.ignoreSubmodules=all diff --no-ext-diff HEAD -- src/export-docx/ExportDOCX_i.c src/export-docx/ExportDOCX_i.h src/export-epub/ExportEPUB_i.c src/export-epub/ExportEPUB_i.h *> out/tests/ubsan/midl-generated.patch
          "patch_exit=$LASTEXITCODE" | Add-Content out/tests/ubsan/source-diff.log
          git status --short --untracked-files=no *> out/tests/ubsan/source-status.log
          "status_exit=$LASTEXITCODE" | Add-Content out/tests/ubsan/source-status.log
      - name: Run full UBSan contour on disposable runner
        timeout-minutes: 120
        shell: pwsh
        run: ./tools/tests/invoke-sanitizer-ci.ps1 -Sanitizer Undefined -AllowUserComRegistration
      - name: Upload UBSan diagnostics
        if: always() && steps.hosted.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: rc3-ubsan-diagnostics
          path: |
            out/tests/ubsan/**
            out/tests/runtime-failure/**
            out/ubsan/Release/fbe-sanitizer.json
            out/ubsan/Release/fbe-ubsan-toolchain.json
          if-no-files-found: error
          retention-days: 14

  validate:
    needs: [compare, ubsan]
    if: always() && !cancelled() && needs.compare.result != 'skipped' && needs.ubsan.result != 'skipped'
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - name: Require GitHub-hosted runner
        id: hosted
        shell: pwsh
        run: if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Self-hosted runners are forbidden.' }
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: c4bcb76c3cd03d1dff88fa557aa75261b4ec0461
          persist-credentials: false
      - name: Check generated Regex Help HTML
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          ./tools/build/generate-regex-help-html.ps1 -Check
      - name: Check disposable Clipboard batch logon before compiling
        shell: pwsh
        run: ./tools/tests/test-fbe-scripting-clipboard-ole-ci.ps1 -ProbeOnly
      - name: Check embedded Script Cards and search index
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          python ./tools/tests/test-script-card-catalog.py
          python ./tools/generate-script-card-index.py --check
      - name: Validate localization preflight
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          ./tools/tests/test-localization-preflight.ps1
          ./tools/tests/test-fbe-runtime-dialog-coverage.ps1
      # validate reads the Lexilla and Hunspell projects to enforce the
      # boundary between first-party and vendored MSBuild policy. Fetching
      # every submodule here is unnecessary and makes this fast job depend on
      # unrelated external hosts.
      - name: Initialize MSBuild policy fixtures
        shell: pwsh
        run: git submodule update --init --depth=1 third_party/lexilla third_party/hunspell
      - name: Check generated version files and pipeline structure
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          ./tools/version/sync-version.ps1
          git diff --exit-code -- packaging/nsis/Installer/version.nsh
          ./tools/tests/test-release-pipeline-deduplication.ps1
          ./tools/tests/test-localization-preflight-regression.ps1
          $workflowSha = $env:GITHUB_SHA
          try {
            $env:GITHUB_SHA = 'c4bcb76c3cd03d1dff88fa557aa75261b4ec0461'
            ./tools/tests/test-ci-suite-deduplication.ps1
          } finally { $env:GITHUB_SHA = $workflowSha }
          ./tools/tests/test-ci-sanitizer-cache-contract.ps1
          ./tools/tests/test-ci-sanitizer-summary.ps1
          ./tools/tests/test-ci-cache-fingerprint-verify.ps1
          ./tools/tests/test-image-stack-cache-contract.ps1
          ./tools/tests/test-update-release-pipeline.ps1
          ./tools/tests/test-update-manifest.ps1
          ./tools/tests/test-legacy308-migration-policy.ps1
          ./tools/tests/test-legacy308-artifact-migration.ps1
          ./tools/tests/test-create-release-alias-names.ps1
          ./tools/tests/test-update-version.ps1
          ./tools/tests/test-buildstamp-fallback.ps1
          ./tools/tests/test-first-party-msbuild-policy.ps1
          ./tools/tests/test-fbe-script-catalog.ps1
          ./tools/tests/test-fbe-structural-commands.ps1
          ./tools/tests/test-fbe-navigation-scripts-contract.ps1
          ./tools/tests/test-document-tree-viewbar-elements.ps1
          ./tools/tests/test-fbe-script-menu-builder.ps1
          ./tools/tests/test-fbe-script-command-ids.ps1
          ./tools/tests/test-fbe-script-startup-validation.ps1
          ./tools/tests/test-portable-scripts-infrastructure.ps1

          ./tools/tests/test-script-toolbar-lifecycle-contract.ps1
          ./tools/tests/test-shift-toolbar-quick-customization-contract.ps1
          ./tools/tests/test-customizable-toolbar-contract.ps1
          ./tools/tests/test-scripts-toolbar-customize-behavior.ps1
          ./tools/tests/test-fbe-script-folder-icons.ps1
          ./tools/tests/test-fbe-settings-tooltips.ps1
          ./tools/tests/test-fbe-body-interface-theme.ps1
          ./tools/tests/test-ci-build-contract.ps1
          ./tools/tests/test-modern-file-dialog-contract.ps1
          ./tools/tests/test-export-html-options-dialog.ps1
          ./tools/tests/test-export-docx-modern-file-dialog.ps1
          ./tools/tests/test-export-epub-modern-file-dialog.ps1
          ./tools/tests/test-import-epub-modern-file-dialog-owner.ps1
          ./tools/tests/test-plugin-source-layout.ps1
          ./tools/build/verify-nsis-layout.ps1
      - name: Test VsDevCmd with a long PATH
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          ./tools/tests/test-vsdev-environment-long-path.ps1
          ./tools/tests/test-cmake-build-tree-fingerprint.ps1
      - name: Summarize validation
        if: always() && steps.hosted.outcome == 'success'
        shell: pwsh
        env:
          STAGE_STATUS: ${{ job.status }}
        run: '"### Validate`nStatus: $env:STAGE_STATUS" >> $env:GITHUB_STEP_SUMMARY'

  build:
    needs: validate
    if: always() && !cancelled() && needs.validate.result == 'success'
    runs-on: windows-2022
    timeout-minutes: 240
    outputs:
      stage3c: ${{ steps.stage3c.outcome }}
    steps:
      - name: Require GitHub-hosted runner
        id: hosted
        shell: pwsh
        run: if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Self-hosted runners are forbidden.' }
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1
          ref: c4bcb76c3cd03d1dff88fa557aa75261b4ec0461
          persist-credentials: false
      - name: Identify cache toolchain
        id: cache-toolchain
        shell: pwsh
        run: |
          . ./tools/build/Import-VsDevEnvironment.ps1 -Arch x86 -HostArch x64 -PlatformToolset v143 -VcVarsVersion 14.44
          if (-not $env:ImageVersion -or -not $env:VCToolsVersion) { throw 'Runner image and compiler versions are required for dependency caches.' }
          $compiler = (Get-Command cl.exe -ErrorAction Stop).Source
          $compilerHash = (Get-FileHash -LiteralPath $compiler -Algorithm SHA256).Hash.ToLowerInvariant()
          "identity=$($env:ImageVersion)-$($env:VCToolsVersion)-$compilerHash" >> $env:GITHUB_OUTPUT
      - name: Restore PCRE2 cache
        uses: actions/cache/restore@v6
        id: pcre2-cache
        with:
          path: build/pcre2
          key: ${{ runner.os }}-pcre2-v2-release-win32-v143-${{ steps.cache-toolchain.outputs.identity }}-${{ hashFiles('third_party/pcre2/**', 'tools/build/build-pcre2.ps1', 'tools/build/CmakeBuildTree.ps1', 'tools/build/Resolve-VsCmake.ps1') }}
      - name: Restore Hunspell cache
        uses: actions/cache/restore@v6
        id: hunspell-cache
        with:
          path: build/hunspell
          key: ${{ runner.os }}-hunspell-v2-release-win32-v143-mt-${{ steps.cache-toolchain.outputs.identity }}-${{ hashFiles('third_party/hunspell/**', 'tools/build/build-hunspell.ps1') }}
      - name: Restore prepared image stack cache
        uses: actions/cache/restore@v6
        id: image-stack-cache
        with:
          path: |
            build/libwebp
            build/openjpeg
            build/aom
            build/libde265
            build/libheif
          key: ${{ runner.os }}-image-stack-v2-release-win32-v143-${{ steps.cache-toolchain.outputs.identity }}-${{ hashFiles('third_party/libwebp/**', 'third_party/openjpeg/**', 'third_party/aom/**', 'third_party/libde265/**', 'third_party/libheif/**', 'tools/build/Resolve-VsCmake.ps1', 'tools/build/CmakeBuildTree.ps1', 'tools/build/build-libwebp.ps1', 'tools/build/build-openjpeg.ps1', 'tools/build/build-aom.ps1', 'tools/build/build-libde265.ps1', 'tools/build/build-libheif.ps1') }}
      - name: Restore universal editor runtime cache
        uses: actions/cache/restore@v6
        id: editor-runtime-cache
        with:
          path: out/editor-runtime
          key: ${{ runner.os }}-editor-runtime-v2-win32-v143-${{ steps.cache-toolchain.outputs.identity }}-${{ hashFiles('third_party/scintilla/**', 'third_party/lexilla/**', 'tools/build/build-scintilla.ps1', 'tools/build/editor-runtime-helpers.ps1') }}
      - name: Build Release Win32
        id: compile
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          $watch = [Diagnostics.Stopwatch]::StartNew()
          try {
            $arguments = @{ Configuration = 'Release'; Platform = 'Win32'; PlatformToolset = 'v143'; SkipUpx = $true; WarningsAsErrors = $true; StrictFirstPartyWarnings = $true; ReuseEditorRuntime = $true; SkipVersionSync = $true; BatchOutputDirectory = 'out/target-batches' }
            if ($env:GITHUB_REF_TYPE -eq 'tag') { $arguments.ReleaseVersion = $env:GITHUB_REF_NAME.Substring(1) }
            if ('${{ steps.pcre2-cache.outputs.cache-hit }}' -eq 'true') { $arguments.ReusePreparedPcre2 = $true }
            if ('${{ steps.image-stack-cache.outputs.cache-hit }}' -eq 'true') { $arguments.ReusePreparedImageStack = $true }
            ./tools/build/build.ps1 @arguments
          } finally { $watch.Stop(); "seconds=$([math]::Round($watch.Elapsed.TotalSeconds, 1))" >> $env:GITHUB_OUTPUT }
      - name: Save PCRE2 cache
        if: steps.pcre2-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/pcre2
          key: ${{ steps.pcre2-cache.outputs.cache-primary-key }}
      - name: Save Hunspell cache
        if: steps.hunspell-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/hunspell
          key: ${{ steps.hunspell-cache.outputs.cache-primary-key }}
      - name: Save prepared image stack cache
        if: steps.image-stack-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            build/libwebp
            build/openjpeg
            build/aom
            build/libde265
            build/libheif
          key: ${{ steps.image-stack-cache.outputs.cache-primary-key }}
      - name: Save universal editor runtime cache
        if: steps.editor-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: out/editor-runtime
          key: ${{ steps.editor-runtime-cache.outputs.cache-primary-key }}
      - name: Run XML source theme v1 runtime regression
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          ./tools/tests/test-fbe-xml-source-theme-v1-runtime.ps1 -FbeExe ./out/Release/FBE.exe
      - name: Run ExportHTML writer ownership harness
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          ./tools/tests/test-export-html-standalone.ps1
          ./tools/tests/test-export-html-correctness.ps1
          ./tools/tests/test-export-html-settings-xsl.ps1
          ./tools/tests/test-export-html-resource-audit.ps1
          ./tools/tests/test-export-html-settings-store.ps1
          ./tools/tests/test-export-html-template-selection.ps1
          ./tools/tests/test-export-html-template-resolver-native.ps1
          ./tools/tests/test-export-html-writer.ps1
          ./tools/tests/test-export-html-split.ps1
          ./tools/tests/test-export-html-split-e2e.ps1 -FbeExe out/Release/FBE.exe
          ./tools/tests/test-export-html-modes.ps1
      - name: Run installed script toolbar lifecycle regression in isolated profile
        shell: pwsh
        env:
          FBE_CI_ISOLATED_PROFILE: '1'
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          ./tools/tests/test-script-toolbar-lifecycle-runtime.ps1 -FbeExe out/Release/FBE.exe -IncludeInstalled
      - name: Run script toolbar tooltip runtime regression
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          ./tools/tests/test-script-toolbar-tooltips-runtime.ps1 -FbeExe out/Release/FBE.exe
          ./tools/tests/test-script-hotkey-management-runtime.ps1 -FbeExe out/Release/FBE.exe
      - name: Run scripting API 1.4 dialogs, clipboard and status regression
        id: stage3c
        continue-on-error: true
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          foreach ($mode in 'portable','installed') {
            foreach ($part in 'dialogs','clipboard','status') {
              ./tools/tests/test-fbe-scripting-stage3c.ps1 -FbeExe out/Release/FBE.exe -Mode $mode -Part $part
            }
          }
          ./tools/tests/test-status-bar-state.ps1
      - name: Run File Close lifecycle regression in isolated profiles
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          ./tools/tests/test-fbe-file-close-runtime.ps1 -FbeExe out/Release/FBE.exe
          ./tools/tests/test-fbe-new-document-safety-runtime.ps1 -FbeExe out/Release/FBE.exe
          ./tools/tests/test-fbe-new-document-safety-runtime.ps1 -FbeExe out/Release/FBE.exe -CleanupContext
          ./tools/tests/test-fbe-file-close-runtime.ps1 -FbeExe out/Release/FBE.exe -Mode installed -Kind fbd -Theme dark
          foreach ($container in 'zip','rar') {
            ./tools/tests/test-fbe-file-close-runtime.ps1 -FbeExe out/Release/FBE.exe -Container $container
          }
      - name: Run scripting API 1.5 save and snapshot regression
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          foreach ($mode in 'portable','installed') {
            foreach ($kind in 'fb2','fbd') {
              ./tools/tests/test-fbe-scripting-stage3d.ps1 -FbeExe out/Release/FBE.exe -Mode $mode -DocumentType $kind
            }
          }
          foreach ($container in 'zip','rar') {
            ./tools/tests/test-fbe-scripting-stage3d.ps1 -FbeExe out/Release/FBE.exe -Container $container
          }
          ./tools/tests/test-fbe-scripting-stage3d.ps1 -FbeExe out/Release/FBE.exe -InputEncoding utf-16
          ./tools/tests/test-fbe-scripting-stage3d.ps1 -FbeExe out/Release/FBE.exe -Mode installed -DocumentType fbd -InputEncoding utf-16
          ./tools/tests/test-fbe-scripting-examples.ps1 -FbeExe out/Release/FBE.exe
      - name: Run real OLE Clipboard in a disposable user logon
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          ./tools/tests/test-fbe-scripting-clipboard-ole-ci.ps1 -FbeExe out/Release/FBE.exe
          $workflowSha = $env:GITHUB_SHA
          try {
            $env:GITHUB_SHA = 'c4bcb76c3cd03d1dff88fa557aa75261b4ec0461'
            ./tools/tests/write-ci-ole-runtime-receipt.ps1 -FbeExe out/Release/FBE.exe
          } finally { $env:GITHUB_SHA = $workflowSha }
      - name: Upload isolated OLE runtime receipt
        uses: actions/upload-artifact@v7
        with:
          name: required-ci-runtime-c4bcb76c3cd03d1dff88fa557aa75261b4ec0461
          path: out/tests/required-ci-runtime/clipboard-ole.json
          if-no-files-found: error
          retention-days: 7
      - name: Run navigation scripts runtime regression
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          ./tools/tests/test-fbe-navigation-startup-mode-runtime.ps1 -FbeExe out/Release/FBE.exe
          ./tools/tests/test-fbe-navigation-scripts-runtime.ps1 -FbeExe out/Release/FBE.exe
          ./tools/tests/test-fbe-script-startup-validation-runtime.ps1 -FbeExe out/Release/FBE.exe
      - name: Run FB2 quality checker runtime regression
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          ./tools/tests/test-fb2-quality-checker-runtime.ps1 -FbeExe out/Release/FBE.exe -ArtifactDirectory ./out/tests/fb2-quality-ui
      - name: Upload FB2 quality checker visual capture
        if: always() && steps.hosted.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: fb2-quality-ui-c4bcb76c3cd03d1dff88fa557aa75261b4ec0461
          path: out/tests/fb2-quality-ui/**
          if-no-files-found: ignore
          retention-days: 3
      - name: Run keyboard layout C++ regression
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          $vsDevCmd = "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat"
          cmd.exe /d /s /c "`"$vsDevCmd`" -arch=x86 -host_arch=x64 -vcvars_ver=14.44 >nul && pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\tests\test-fbe-keyboard-layout-selection-cpp.ps1"
      - name: Run Search Core regressions
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          ./tools/tests/test-search-core-suite.ps1 -Configuration Release -PlatformToolset v143 -FbeExe ./out/Release/FBE.exe
      - name: Run Full Regex Help regressions
        id: full-regex-help
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          ./tools/tests/test-regex-help-markdown.ps1
          ./tools/tests/test-regex-help-html.ps1
          ./tools/tests/test-regex-help-formatting.ps1
          ./tools/tests/test-regex-help-runtime.ps1 -FbeExe ./out/Release/FBE.exe
          ./tools/tests/test-regex-help-visual-runtime.ps1 -ArtifactDirectory ./out/tests/full-regex-help-html
      - name: Upload Full Regex Help visual smoke captures
        if: always() && steps.hosted.outcome == 'success' && steps.full-regex-help.outcome != 'skipped' && steps.full-regex-help.outcome != ''
        uses: actions/upload-artifact@v7
        with:
          name: full-regex-help-html-c4bcb76c3cd03d1dff88fa557aa75261b4ec0461
          path: out/tests/full-regex-help-html/**
          if-no-files-found: error
          retention-days: 3
      - name: Run filesystem backup regression
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          ./tools/tests/test-fbe-backup-file-commit.ps1
      - name: Build Win32 shell integration
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          ./tools/build/build-shell-integration.ps1 -Configuration Release -Platform Win32 -PlatformToolset v143
      - name: Build x64 shell integration
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          ./tools/build/build-shell-integration.ps1 -Configuration Release -Platform x64 -PlatformToolset v143
      - name: Verify shell integration build outputs
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          ./tools/tests/test-ci-build-contract.ps1 -RequireArtifacts
      - name: Build FBV Verb MUI
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          ./tools/build/build-fbv-verb-mui.ps1 -Configuration Release -PlatformToolset v143
      - name: Write Runtime build provenance
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          ./tools/build/build-provenance.ps1 -Action Write -Kind Runtime -Configuration Release -ProfileDirectory out/editor-runtime -BatchDirectory out/target-batches -PlatformToolset v143
      - name: Ensure NSIS 3.13
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          choco upgrade nsis --version=3.13.0 --no-progress --yes
          ./tools/build/resolve-nsis.ps1 | Out-Null
      - name: Smoke NSIS install scopes
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          ./tools/tests/test-nsis-install-scopes.ps1
          ./tools/tests/test-prerelease-nsis-state.ps1
      - name: Verify universal release binaries, document tree and Dark Theme stabilization runtime
        id: release-verification
        shell: pwsh
        env:
          FBE_RUNTIME_FAILURE_ARTIFACTS: out/tests/runtime-failure
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          $watch = [Diagnostics.Stopwatch]::StartNew()
          $workflowSha = $env:GITHUB_SHA
          try {
            $env:GITHUB_SHA = 'c4bcb76c3cd03d1dff88fa557aa75261b4ec0461'
            $arguments = @{ Configuration = 'Release'; PlatformToolset = 'v143'; SkipUpdateManifest = $true; SkipLocalizationPreflight = $true; SkipEarlyRuntimeSuites = $true; BatchOutputDirectory = 'out/target-batches' }
            if ($env:GITHUB_REF_TYPE -eq 'tag' -or '${{ true }}' -eq 'true') { $arguments.FullValidation = $true; $arguments.AllowUserComRegistration = $true }
            ./tools/build/verify-release.ps1 @arguments
          } finally { $env:GITHUB_SHA = $workflowSha; $watch.Stop(); "seconds=$([math]::Round($watch.Elapsed.TotalSeconds, 1))" >> $env:GITHUB_OUTPUT }
      - name: Upload prerequisite P0 reports
        if: always() && steps.hosted.outcome == 'success' && steps.release-verification.outcome != 'skipped' && steps.release-verification.outcome != ''
        uses: actions/upload-artifact@v7
        with:
          name: prerelease-p0-c4bcb76c3cd03d1dff88fa557aa75261b4ec0461
          path: out/tests/prerelease-p0/**
          if-no-files-found: error
          retention-days: 14
      - name: Smoke bundled plugin upgrade and uninstall
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          $testRoot = 'out/tests/bundled-plugin-installer-smoke'
          $repoRoot = (Get-Location).Path
          ./tools/build/stage-core.ps1 -Configuration Release -OutputDirectory "$testRoot/Core" -EditorRuntimeDirectory out/editor-runtime -BatchOutputDirectory out/target-batches
          ./tools/build/stage-integration.ps1 -Configuration Release -OutputDirectory "$testRoot/Integration"
          ./tools/build/prepare-installer.ps1 -CoreDirectory "$testRoot/Core" -IntegrationDirectory "$testRoot/Integration" -OutputDirectory "$testRoot/Input"
          $makensis = ./tools/build/resolve-nsis.ps1
          $installerDirectory = Join-Path $PWD 'packaging/nsis/Installer'
          $setup = Join-Path $PWD "$testRoot/setup.exe"
          $input = Join-Path $repoRoot "$testRoot/Input"
          Push-Location $installerDirectory
          try {
            & $makensis '/X!addincludedir ..\NSIS' '/X!addplugindir /x86-unicode ..\NSIS' ('/DINPUTDIR=' + $input) ('/DOUTPUTFILE=' + $setup) 'MakeInstaller.nsi'
            if ($LASTEXITCODE -ne 0) { throw "makensis failed for bundled plugin upgrade smoke: $LASTEXITCODE" }
          }
          finally { Pop-Location }
          ./tools/tests/test-bundled-plugin-upgrade-uninstall.ps1 -InstallerPath $setup -PluginSourceDirectory "$testRoot/Input/Plugins" -TestDirectory "$testRoot/run"
      - name: Upload compiled inputs
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: FictionBookEditorNext-c4bcb76c3cd03d1dff88fa557aa75261b4ec0461-compiled
          path: |
            out/Release
            out/editor-runtime
            out/package/shell-build
            out/target-batches
            out/build-provenance
          if-no-files-found: error
          retention-days: 3
      - name: Check runtime diagnostics availability
        if: failure() && steps.hosted.outcome == 'success'
        id: runtime-diagnostics
        shell: pwsh
        run: |
          function Test-DiagnosticFiles([string]$path) {
            return $null -ne (Get-ChildItem -LiteralPath $path -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1)
          }
          "editor_background_has_files=$(Test-DiagnosticFiles 'out/tests/editor-background-runtime-failure')" >> $env:GITHUB_OUTPUT
          "runtime_has_files=$(Test-DiagnosticFiles 'out/tests/runtime-failure')" >> $env:GITHUB_OUTPUT
          "issue64_has_files=$(Test-DiagnosticFiles 'out/issue64')" >> $env:GITHUB_OUTPUT
      - name: Upload failed issue64 capture diagnostics
        if: failure() && steps.hosted.outcome == 'success' && steps.runtime-diagnostics.outputs.issue64_has_files == 'True'
        uses: actions/upload-artifact@v7
        with:
          name: issue64-capture-diagnostics-c4bcb76c3cd03d1dff88fa557aa75261b4ec0461
          path: out/issue64/**
          if-no-files-found: error
          retention-days: 7
      - name: Upload editor background runtime diagnostics
        if: failure() && steps.hosted.outcome == 'success' && steps.runtime-diagnostics.outputs.editor_background_has_files == 'True'
        uses: actions/upload-artifact@v7
        with:
          name: editor-background-runtime-diagnostics
          path: out/tests/editor-background-runtime-failure/**
          if-no-files-found: error
          retention-days: 7
      - name: Upload failed runtime diagnostics
        if: failure() && steps.hosted.outcome == 'success' && steps.runtime-diagnostics.outputs.runtime_has_files == 'True'
        uses: actions/upload-artifact@v7
        with:
          name: runtime-failure-diagnostics
          path: out/tests/runtime-failure/**
          if-no-files-found: error
          retention-days: 7
      - name: Upload Stage3C failure diagnostics
        if: always() && steps.hosted.outcome == 'success' && steps.stage3c.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: rc3-stage3c-failure
          path: out/tests/runtime-failure/**
          if-no-files-found: warn
          retention-days: 14
      - name: Summarize build and verification
        if: always() && steps.hosted.outcome == 'success'
        shell: pwsh
        env:
          STAGE_STATUS: ${{ job.status }}
          COMPILE_RESULT: ${{ steps.compile.outcome }}
          COMPILE_SECONDS: ${{ steps.compile.outputs.seconds }}
          VERIFY_RESULT: ${{ steps.release-verification.outcome }}
          VERIFY_SECONDS: ${{ steps.release-verification.outputs.seconds }}
          PCRE_HIT: ${{ steps.pcre2-cache.outputs.cache-hit }}
          HUNSPELL_HIT: ${{ steps.hunspell-cache.outputs.cache-hit }}
          IMAGE_HIT: ${{ steps.image-stack-cache.outputs.cache-hit }}
          RUNTIME_HIT: ${{ steps.editor-runtime-cache.outputs.cache-hit }}
          STAGE3C_RESULT: ${{ steps.stage3c.outcome }}
        run: |
          function Show([string]$value) { if ($value) { $value } else { 'NOT RUN' } }
          @(
            '### Build and verification',
            "Job: $env:STAGE_STATUS; compile: $(Show $env:COMPILE_RESULT) ($(Show $env:COMPILE_SECONDS) s); verification: $(Show $env:VERIFY_RESULT) ($(Show $env:VERIFY_SECONDS) s).",
            "Stage3C: $(Show $env:STAGE3C_RESULT).",
            "Cache hits (empty means miss or not run): PCRE2=$(Show $env:PCRE_HIT), Hunspell=$(Show $env:HUNSPELL_HIT), image=$(Show $env:IMAGE_HIT), editor runtime=$(Show $env:RUNTIME_HIT).",
            'Detailed test counts and failures: see the step log; a skipped verification is not PASS.',
            "[Run artifacts]($env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID#artifacts)"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

  package:
    if: always() && !cancelled() && needs.validate.result == 'success' && needs.build.result == 'success'
    needs: [validate, build]
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - name: Require GitHub-hosted runner
        id: hosted
        shell: pwsh
        run: if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Self-hosted runners are forbidden.' }
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: c4bcb76c3cd03d1dff88fa557aa75261b4ec0461
          persist-credentials: false
      - name: Initialize package license submodules
        shell: pwsh
        run: |
          # Packaging stages only license notices from these sources. Keep this
          # checkout shallow and explicit; do not recursively fetch build-only
          # third-party trees.
          git submodule update --init --depth=1 third_party/scintilla third_party/pcre2 third_party/hunspell third_party/libwebp third_party/openjpeg third_party/libheif third_party/libde265 third_party/aom third_party/lunasvg third_party/uac
          git -C third_party/lunasvg submodule update --init --depth=1 plutovg
      - name: Download compiled inputs
        uses: actions/download-artifact@v8
        with:
          name: FictionBookEditorNext-c4bcb76c3cd03d1dff88fa557aa75261b4ec0461-compiled
          path: out
      - name: Ensure NSIS 3.13
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          choco upgrade nsis --version=3.13.0 --no-progress --yes
          ./tools/build/resolve-nsis.ps1 | Out-Null
      - name: Smoke NSIS install scopes
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          ./tools/tests/test-nsis-install-scopes.ps1
          ./tools/tests/test-prerelease-nsis-state.ps1
      - name: Create release artifacts without compiling
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          $arguments = @{ Configuration = "Release"; Platform = "Win32"; PlatformToolset = "v143"; SkipBuild = $true; SkipPropertyHandlerBuild = $true; SkipFbvVerbMuiBuild = $true; SkipReleaseVerification = $true; SkipArtifactVerification = $true; SkipVersionSync = $true; BatchOutputDirectory = "out/target-batches" }
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $arguments.ReleaseTag = $env:GITHUB_REF_NAME
            $arguments.FullValidation = $true
            if ($env:GITHUB_REF_NAME -match '^v\d+\.\d+\.\d+-') { $arguments.Prerelease = $true }
          }
          elseif ('${{ true }}' -eq 'true') { $arguments.FullValidation = $true }
          ./tools/build/create-release.ps1 @arguments
      - name: Smoke packaged installer upgrade and uninstall
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          $setup = Get-ChildItem -LiteralPath out/artifacts -Filter '*-setup.exe' -File | Where-Object { $_.Name -notmatch '-win7-' } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $setup) { throw 'The package job did not produce the canonical setup artifact.' }
          ./tools/tests/test-bundled-plugin-upgrade-uninstall.ps1 -InstallerPath $setup -PluginSourceDirectory out/package/InstallerInput/Plugins -TestDirectory out/tests/packaged-plugin-installer-smoke
      - name: Verify release archives
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          $arguments = @{ Platform = 'Win32' }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $arguments.ReleaseTag = $env:GITHUB_REF_NAME
            . ./tools/build/UpdateVersion.ps1
            if (Test-FbeLegacy308MigrationRequired $env:GITHUB_REF_NAME.Substring(1)) {
              $arguments.AllowLegacyWin7Aliases = $true
            }
          }
          ./tools/build/verify-artifacts.ps1 @arguments
      - name: Create update manifest candidate
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          ./tools/build/Initialize-CiUtf8.ps1
          ./tools/build/new-update-manifest-candidate.ps1 -ArtifactsRoot out/artifacts -OutputPath out/release/update.xml -ReleaseTag "${{ github.ref_name }}"
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: FictionBookEditorNext-c4bcb76c3cd03d1dff88fa557aa75261b4ec0461-release
          path: |
            out/artifacts
            out/release/update.xml
          if-no-files-found: error
          retention-days: 14
      - name: Summarize package
        if: always() && steps.hosted.outcome == 'success'
        shell: pwsh
        env:
          STAGE_STATUS: ${{ job.status }}
        run: '"### Package`nStatus: $env:STAGE_STATUS" >> $env:GITHUB_STEP_SUMMARY'


  acceptance-result:
    if: always()
    needs: [candidate, compare, ubsan, validate, build, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every contour
        env:
          CANDIDATE: ${{ needs.candidate.result }}
          COMPARE: ${{ needs.compare.result }}
          UBSAN: ${{ needs.ubsan.result }}
          VALIDATE: ${{ needs.validate.result }}
          BUILD: ${{ needs.build.result }}
          PACKAGE: ${{ needs.package.result }}
          STAGE3C: ${{ needs.build.outputs.stage3c }}
        run: |
          printf 'candidate=%s compare=%s ubsan=%s validate=%s build=%s package=%s stage3c=%s\n' "$CANDIDATE" "$COMPARE" "$UBSAN" "$VALIDATE" "$BUILD" "$PACKAGE" "$STAGE3C"
          test "$CANDIDATE" = success && test "$COMPARE" = success && test "$UBSAN" = success && test "$VALIDATE" = success && test "$BUILD" = success && test "$PACKAGE" = success && test "$STAGE3C" = success
